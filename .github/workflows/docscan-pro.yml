                      val warpedPath = fileStore.saveJpeg(w, fileStore.newImageFile("warp"), 97)
                      val processedPath = fileStore.saveJpeg(p, fileStore.newImageFile("proc"), 95)
                      w.recycle(); p.recycle()
                      page.copy(warpedPath = warpedPath, processedPath = processedPath)
                  }
              }
