          cat > 'app/src/main/java/com/docscan/pro/MainActivity.kt' << 'DSP_EOF_7'
          package com.docscan.pro

          import android.app.Application
          import coil.ImageLoader
          import coil.ImageLoaderFactory
          import coil.decode.VideoFrameDecoder
          import android.os.Bundle
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Surface
          import androidx.compose.ui.Modifier
          import androidx.fragment.app.FragmentActivity
          import com.docscan.pro.core.cv.OpenCvInit
          import com.docscan.pro.core.utils.FileStore
          import com.docscan.pro.presentation.navigation.DocScanNavGraph
          import com.docscan.pro.presentation.theme.DocScanTheme
          import dagger.hilt.android.AndroidEntryPoint
          import dagger.hilt.android.HiltAndroidApp
          import javax.inject.Inject

          /** Application Hilt ; charge OpenCV et nettoie les PDF déchiffrés temporaires. */
          @HiltAndroidApp
          class DocScanApp : Application(), ImageLoaderFactory {
              @Inject lateinit var fileStore: FileStore

              override fun onCreate() {
                  super.onCreate()
                  OpenCvInit.ensure()
                  fileStore.clearShareCache()
              }

              /** Coil sait aussi afficher la première image d'une vidéo (vignette). */
              override fun newImageLoader(): ImageLoader = ImageLoader.Builder(this)
                  .components { add(VideoFrameDecoder.Factory()) }
                  .crossfade(true)
                  .build()
          }

          /** Activité unique (FragmentActivity requise par BiometricPrompt). */
          @AndroidEntryPoint
          class MainActivity : FragmentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  enableEdgeToEdge()
                  super.onCreate(savedInstanceState)
                  setContent {
                      DocScanTheme {
                          Surface(Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                              DocScanNavGraph()
                          }
                      }
                  }
              }
          }
          DSP_EOF_7
          mkdir -p 'app/src/main/java/com/docscan/pro/core/camera'
          cat > 'app/src/main/java/com/docscan/pro/core/camera/CameraController.kt' << 'DSP_EOF_8'
          package com.docscan.pro.core.camera

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.Context
          import android.hardware.camera2.CaptureRequest
          import androidx.annotation.OptIn
          import androidx.camera.camera2.interop.Camera2Interop
          import androidx.camera.camera2.interop.ExperimentalCamera2Interop
          import kotlinx.coroutines.withTimeoutOrNull
          import android.content.pm.PackageManager
          import androidx.camera.core.AspectRatio
          import androidx.camera.video.FallbackStrategy
          import androidx.camera.video.FileDescriptorOutputOptions
          import androidx.camera.video.FileOutputOptions
          import androidx.camera.video.Quality
          import androidx.camera.video.QualitySelector
          import androidx.camera.video.Recorder
          import androidx.camera.video.Recording
          import androidx.camera.video.VideoCapture
          import androidx.camera.video.VideoRecordEvent
          import com.docscan.pro.core.utils.VideoTarget
          import com.docscan.pro.data.model.VideoQuality
          import android.net.Uri
          import android.util.Size
          import androidx.camera.core.Camera
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.FocusMeteringAction
          import androidx.camera.core.ImageAnalysis
          import androidx.camera.core.ImageCapture
          import androidx.camera.core.ImageCaptureException
          import androidx.camera.core.Preview
          import androidx.camera.core.resolutionselector.AspectRatioStrategy
          import androidx.camera.core.resolutionselector.ResolutionSelector
          import androidx.camera.core.resolutionselector.ResolutionStrategy
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.view.PreviewView
          import androidx.core.content.ContextCompat
          import androidx.lifecycle.LifecycleOwner
          import com.docscan.pro.data.model.AppResult
          import com.docscan.pro.data.model.FlashSetting
          import kotlinx.coroutines.suspendCancellableCoroutine
          import java.io.File
          import java.util.concurrent.ExecutorService
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit
          import kotlin.coroutines.resume

          /**
           * Pilote CameraX : aperçu 4:3, analyse temps réel (640x480), capture haute qualité,
           * flash, torche, zoom par pincement, mise au point par toucher, caméra avant/arrière.
           */
          class CameraController(private val context: Context) {

              private var provider: ProcessCameraProvider? = null
              private var imageCapture: ImageCapture? = null
              private var analysis: ImageAnalysis? = null
              private var camera: Camera? = null
              private val analysisExecutor: ExecutorService = Executors.newSingleThreadExecutor()
              private var flashMode: Int = ImageCapture.FLASH_MODE_OFF
              private var torchWanted = false
              private var videoCapture: VideoCapture<Recorder>? = null
              private var recording: Recording? = null

              /**
               * Lie les cas d'usage caméra au [owner] ; [front] choisit la caméra avant.
               * [video] = aperçu 16:9 + enregistrement vidéo, sinon aperçu 4:3 + analyse + photo.
               */
              fun bind(
                  owner: LifecycleOwner,
                  previewView: PreviewView,
                  analyzer: ImageAnalysis.Analyzer,
                  front: Boolean,
                  video: Boolean,
                  videoQuality: VideoQuality,
                  onError: (Throwable) -> Unit
              ) {
                  val future = ProcessCameraProvider.getInstance(context)
                  future.addListener({
                      try {
                          val p = future.get()
                          provider = p
                          val ratio43 = ResolutionSelector.Builder()
                              .setAspectRatioStrategy(AspectRatioStrategy.RATIO_4_3_FALLBACK_AUTO_STRATEGY)
                              .build()
                          val analysisSelector = ResolutionSelector.Builder()
                              .setAspectRatioStrategy(AspectRatioStrategy.RATIO_4_3_FALLBACK_AUTO_STRATEGY)
                              .setResolutionStrategy(
                                  ResolutionStrategy(Size(640, 480), ResolutionStrategy.FALLBACK_RULE_CLOSEST_HIGHER_THEN_LOWER)
                              )
                              .build()
                          val selector = if (front && hasCamera(p, CameraSelector.DEFAULT_FRONT_CAMERA))
                              CameraSelector.DEFAULT_FRONT_CAMERA else CameraSelector.DEFAULT_BACK_CAMERA
                          if (video) {
                              val ratio169 = ResolutionSelector.Builder()
                                  .setAspectRatioStrategy(AspectRatioStrategy.RATIO_16_9_FALLBACK_AUTO_STRATEGY)
                                  .build()
                              val preview = Preview.Builder().setResolutionSelector(ratio169).build()
                              preview.setSurfaceProvider(previewView.surfaceProvider)
                              val target = when (videoQuality.height) {
                                  1080 -> Quality.FHD
                                  720 -> Quality.HD
                                  else -> Quality.SD
                              }
                              val recorder = Recorder.Builder()
                                  .setQualitySelector(
                                      QualitySelector.from(target, FallbackStrategy.lowerQualityOrHigherThan(target))
                                  )
                                  .setTargetVideoEncodingBitRate(videoQuality.bitRate)
                                  .setAspectRatio(AspectRatio.RATIO_16_9)
                                  .build()
                              val vc = VideoCapture.withOutput(recorder)
                              videoCapture = vc
                              imageCapture = null
                              analysis?.clearAnalyzer()
                              analysis = null
                              p.unbindAll()
                              val cam = p.bindToLifecycle(owner, selector, preview, vc)
                              camera = cam
                              if (torchWanted && cam.cameraInfo.hasFlashUnit()) cam.cameraControl.enableTorch(true)
                              return@addListener
                          }
                          videoCapture = null
                          val preview = Preview.Builder().setResolutionSelector(ratio43).build()
                          preview.setSurfaceProvider(previewView.surfaceProvider)
                          val ia = ImageAnalysis.Builder()
                              .setResolutionSelector(analysisSelector)
                              .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                              .setOutputImageFormat(ImageAnalysis.OUTPUT_IMAGE_FORMAT_YUV_420_888)
                              .build()
                          ia.setAnalyzer(analysisExecutor, analyzer)
                          analysis = ia
                          // Capture : plus haute résolution 4:3 du capteur (≈ 12 Mpx sur Redmi Note 11 Pro),
                          // JPEG 100 %, réduction de bruit et netteté en mode « haute qualité ».
                          val highest = ResolutionSelector.Builder()
                              .setAspectRatioStrategy(AspectRatioStrategy.RATIO_4_3_FALLBACK_AUTO_STRATEGY)
                              .setResolutionStrategy(ResolutionStrategy.HIGHEST_AVAILABLE_STRATEGY)
                              .build()
                          val captureBuilder = ImageCapture.Builder()
                              .setResolutionSelector(highest)
                              .setCaptureMode(ImageCapture.CAPTURE_MODE_MAXIMIZE_QUALITY)
                              .setJpegQuality(100)
                              .setFlashMode(flashMode)
                          applyHighQuality(captureBuilder)
                          val capture = captureBuilder.build()
                          imageCapture = capture
                          p.unbindAll()
                          val cam = p.bindToLifecycle(owner, selector, preview, ia, capture)
                          camera = cam
                          if (torchWanted && cam.cameraInfo.hasFlashUnit()) cam.cameraControl.enableTorch(true)
                      } catch (t: Throwable) {
                          onError(t)
                      }
                  }, ContextCompat.getMainExecutor(context))
              }

              @OptIn(ExperimentalCamera2Interop::class)
              private fun applyHighQuality(builder: ImageCapture.Builder) {
                  try {
                      Camera2Interop.Extender(builder)
                          .setCaptureRequestOption(CaptureRequest.NOISE_REDUCTION_MODE, CaptureRequest.NOISE_REDUCTION_MODE_HIGH_QUALITY)
                          .setCaptureRequestOption(CaptureRequest.EDGE_MODE, CaptureRequest.EDGE_MODE_HIGH_QUALITY)
                  } catch (e: Exception) {
                      // Option non prise en charge : CameraX garde ses valeurs par défaut.
                  }
              }

              /** Mise au point sur ([x], [y]) en pixels de l'aperçu, en attendant au plus [timeoutMs] ms. */
              suspend fun focusAndWait(view: PreviewView, x: Float, y: Float, timeoutMs: Long = 1200) {
                  val cam = camera ?: return
                  val point = view.meteringPointFactory.createPoint(x, y)
                  val action = FocusMeteringAction.Builder(point, FocusMeteringAction.FLAG_AF or FocusMeteringAction.FLAG_AE)
                      .setAutoCancelDuration(4, TimeUnit.SECONDS)
                      .build()
                  val future = cam.cameraControl.startFocusAndMetering(action)
                  withTimeoutOrNull(timeoutMs) {
                      suspendCancellableCoroutine<Unit> { cont ->
                          future.addListener({ if (cont.isActive) cont.resume(Unit) }, ContextCompat.getMainExecutor(context))
                      }
                  }
              }

              private fun hasCamera(p: ProcessCameraProvider, selector: CameraSelector): Boolean =
                  try { p.hasCamera(selector) } catch (e: Exception) { false }

              /** Capture une photo dans un fichier privé (mode Documents). */
              suspend fun capture(file: File): AppResult<File> =
                  when (val r = take(ImageCapture.OutputFileOptions.Builder(file).build())) {
                      is AppResult.Success -> AppResult.Success(file)
                      is AppResult.Error -> r
                  }

              /** Capture une photo vers [options] (galerie) ; renvoie l'Uri enregistrée si connue. */
              suspend fun captureTo(options: ImageCapture.OutputFileOptions): AppResult<Uri?> = take(options)

              private suspend fun take(options: ImageCapture.OutputFileOptions): AppResult<Uri?> =
                  suspendCancellableCoroutine { cont ->
                      val capture = imageCapture
                      if (capture == null) {
                          cont.resume(AppResult.Error("Caméra non prête")); return@suspendCancellableCoroutine
                      }
                      capture.takePicture(options, ContextCompat.getMainExecutor(context),
                          object : ImageCapture.OnImageSavedCallback {
                              override fun onImageSaved(output: ImageCapture.OutputFileResults) {
                                  if (cont.isActive) cont.resume(AppResult.Success(output.savedUri))
                              }

                              override fun onError(exception: ImageCaptureException) {
                                  if (cont.isActive) cont.resume(AppResult.Error(exception.message ?: "Capture échouée", exception))
                              }
                          })
                  }

              /** Réglage du flash pour les photos. */
              fun setFlash(setting: FlashSetting) {
                  flashMode = when (setting) {
                      FlashSetting.OFF -> ImageCapture.FLASH_MODE_OFF
                      FlashSetting.AUTO -> ImageCapture.FLASH_MODE_AUTO
                      FlashSetting.ON -> ImageCapture.FLASH_MODE_ON
                  }
                  imageCapture?.flashMode = flashMode
              }

              /** Allume / éteint la torche (lumière continue). */
              fun setTorch(on: Boolean) {
                  torchWanted = on
                  val cam = camera ?: return
                  if (cam.cameraInfo.hasFlashUnit()) cam.cameraControl.enableTorch(on)
              }

              /** Multiplie le zoom courant par [factor] (geste de pincement). */
              fun scaleZoom(factor: Float) {
                  val cam = camera ?: return
                  val z = cam.cameraInfo.zoomState.value ?: return
                  cam.cameraControl.setZoomRatio((z.zoomRatio * factor).coerceIn(z.minZoomRatio, z.maxZoomRatio))
              }

              /** Zoom courant (1.0 = aucun). */
              fun zoomRatio(): Float = camera?.cameraInfo?.zoomState?.value?.zoomRatio ?: 1f

              /** Mise au point et exposition au point touché. */
              fun focusAt(view: PreviewView, x: Float, y: Float) {
                  val cam = camera ?: return
                  val point = view.meteringPointFactory.createPoint(x, y)
                  val action = FocusMeteringAction.Builder(point, FocusMeteringAction.FLAG_AF or FocusMeteringAction.FLAG_AE)
                      .setAutoCancelDuration(3, TimeUnit.SECONDS)
                      .build()
                  cam.cameraControl.startFocusAndMetering(action)
              }

              /**
               * Démarre un enregistrement vers [target] ; [audio] seulement si la permission micro est accordée.
               * Renvoie false si la caméra vidéo n'est pas prête.
               */
              @SuppressLint("MissingPermission")
