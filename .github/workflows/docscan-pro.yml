                      val warped = BitmapUtils.decode(page.warpedPath)
                      val out = enhancer.apply(warped, filter)
                      warped.recycle()
                      val path = fileStore.saveJpeg(out, fileStore.newImageFile("proc"), 95)
                      out.recycle()
                      page.copy(processedPath = path, filter = filter)
