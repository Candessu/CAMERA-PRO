          /** Graphe : Caméra (écran principal) ⇄ Éditeur → Export → Bibliothèque. */
          @Composable
          fun DocScanNavGraph(nav: NavHostController = rememberNavController()) {
              NavHost(navController = nav, startDestination = Screen.Camera.route) {
                  composable(Screen.Camera.route) {
                      CameraScreen(
                          onOpenEditor = { nav.navigate(Screen.Editor.route) { launchSingleTop = true } },
                          onLibrary = { nav.navigate(Screen.Library.route) { launchSingleTop = true } },
                          onSettings = { nav.navigate(Screen.Settings.route) { launchSingleTop = true } }
                      )
                  }
                  composable(Screen.Editor.route) {
                      EditorScreen(
                          onAddPage = { nav.popBackStack(Screen.Camera.route, inclusive = false) },
                          onFinish = { nav.navigate(Screen.Export.route) { launchSingleTop = true } },
                          onBack = { nav.popBackStack(Screen.Camera.route, inclusive = false) }
                      )
                  }
                  composable(Screen.Export.route) {
                      ExportScreen(
                          onExported = { toLibrary ->
                              if (toLibrary) {
                                  nav.navigate(Screen.Library.route) {
                                      popUpTo(Screen.Camera.route) { inclusive = false }
                                  }
                              } else {
                                  nav.popBackStack(Screen.Camera.route, inclusive = false)
                              }
                          },
                          onBack = { nav.popBackStack() }
