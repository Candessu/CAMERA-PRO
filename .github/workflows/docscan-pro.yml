                  if (dir != null && dir.canWrite()) dir.createFile(mime, name)?.uri else null
              } catch (e: Exception) {
                  null
              }

              /** Prépare la cible de la prochaine photo. */
              fun photoOutput(dest: PhotoDestination, treeUri: String?): PhotoTarget {
                  val name = newName()
                  if (dest == PhotoDestination.CUSTOM) {
                      val doc = createInTree(treeUri, name)
                      val stream = doc?.let { runCatching { context.contentResolver.openOutputStream(it) }.getOrNull() }
                      if (doc != null && stream != null) {
                          return PhotoTarget(ImageCapture.OutputFileOptions.Builder(stream).build(), null, doc, stream)
                      }
                      doc?.let { delete(it) }
                  }
                  val fallback = if (dest == PhotoDestination.CUSTOM) PhotoDestination.PICTURES else dest
                  return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      val values = ContentValues().apply {
                          put(MediaStore.Images.Media.DISPLAY_NAME, "$name.jpg")
                          put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                          put(MediaStore.Images.Media.RELATIVE_PATH, relativePath(fallback))
                      }
                      PhotoTarget(
                          ImageCapture.OutputFileOptions.Builder(
                              context.contentResolver, MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values
                          ).build(),
                          null, null, null
                      )
                  } else {
                      val file = File(legacyDir(fallback), "$name.jpg")
                      PhotoTarget(ImageCapture.OutputFileOptions.Builder(file).build(), file, null, null)
                  }
              }

              /** Finalise après la capture ; renvoie l'Uri de la photo (null si échec). */
              fun finish(target: PhotoTarget, success: Boolean, savedUri: Uri?): Uri? {
                  runCatching { target.stream?.close() }
                  if (!success) {
                      target.documentUri?.let { delete(it) }
                      target.legacyFile?.delete()
                      return null
                  }
                  target.legacyFile?.let { scan(it) }
                  return target.documentUri ?: savedUri ?: target.legacyFile?.let { uriForFile(it) }
              }

              /** Prépare la cible de la prochaine vidéo (même dossier que les photos ; Movies pour « Images »). */
              fun videoOutput(dest: PhotoDestination, treeUri: String?): VideoTarget {
                  val name = newName("VID")
                  if (dest == PhotoDestination.CUSTOM) {
                      val doc = createInTree(treeUri, name, "video/mp4")
                      val pfd = doc?.let { runCatching { context.contentResolver.openFileDescriptor(it, "rw") }.getOrNull() }
                      if (doc != null && pfd != null) return VideoTarget(null, null, pfd, doc)
                      doc?.let { delete(it) }
                  }
                  val fallback = if (dest == PhotoDestination.CUSTOM) PhotoDestination.PICTURES else dest
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      val values = ContentValues().apply {
                          put(MediaStore.Video.Media.DISPLAY_NAME, "$name.mp4")
                          put(MediaStore.Video.Media.MIME_TYPE, "video/mp4")
                          put(MediaStore.Video.Media.RELATIVE_PATH, relativePath(fallback, video = true))
                      }
                      val options = MediaStoreOutputOptions.Builder(context.contentResolver, MediaStore.Video.Media.EXTERNAL_CONTENT_URI)
                          .setContentValues(values)
                          .build()
                      return VideoTarget(options, null, null, null)
                  }
                  val dir = if (fallback == PhotoDestination.DCIM) legacyDir(fallback) else appMoviesDir()
                  return VideoTarget(null, File(dir, "$name.mp4"), null, null)
              }

              /** Finalise une vidéo ; renvoie son Uri (null si échec). */
              fun finishVideo(target: VideoTarget, success: Boolean, savedUri: Uri?): Uri? {
                  runCatching { target.descriptor?.close() }
                  if (!success) {
                      target.documentUri?.let { delete(it) }
                      target.file?.delete()
                      return null
                  }
                  target.file?.let {
                      MediaScannerConnection.scanFile(context, arrayOf(it.absolutePath), arrayOf("video/mp4"), null)
                  }
                  return target.documentUri ?: savedUri?.takeIf { it != Uri.EMPTY } ?: target.file?.let { uriForFile(it) }
              }

              private fun delete(uri: Uri) {
                  runCatching { DocumentsContract.deleteDocument(context.contentResolver, uri) }
              }

              private fun scan(file: File) {
                  MediaScannerConnection.scanFile(context, arrayOf(file.absolutePath), arrayOf("image/jpeg"), null)
              }

              /** Copie une image JPEG vers le dossier des photos et renvoie son Uri. */
              fun saveToGallery(src: File, baseName: String, dest: PhotoDestination, treeUri: String?): Uri {
                  if (dest == PhotoDestination.CUSTOM) {
                      val doc = createInTree(treeUri, baseName)
                      if (doc != null) {
                          context.contentResolver.openOutputStream(doc).use { out ->
                              requireNotNull(out) { "Dossier inaccessible" }
                              src.inputStream().use { it.copyTo(out) }
                          }
                          return doc
                      }
                  }
                  val fallback = if (dest == PhotoDestination.CUSTOM) PhotoDestination.PICTURES else dest
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      val resolver = context.contentResolver
                      val values = ContentValues().apply {
                          put(MediaStore.Images.Media.DISPLAY_NAME, "$baseName.jpg")
                          put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                          put(MediaStore.Images.Media.RELATIVE_PATH, relativePath(fallback))
                          put(MediaStore.Images.Media.IS_PENDING, 1)
                      }
                      val uri = requireNotNull(resolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values)) {
                          "Galerie indisponible"
                      }
                      resolver.openOutputStream(uri).use { out ->
                          requireNotNull(out) { "Galerie indisponible" }
                          src.inputStream().use { it.copyTo(out) }
                      }
                      values.clear()
                      values.put(MediaStore.Images.Media.IS_PENDING, 0)
                      resolver.update(uri, values, null, null)
                      return uri
                  }
                  val target = File(legacyDir(fallback), "$baseName.jpg")
                  src.copyTo(target, overwrite = true)
                  scan(target)
                  return uriForFile(target)
              }
