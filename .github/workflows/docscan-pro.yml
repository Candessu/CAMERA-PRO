          package com.docscan.pro.data.model

          import kotlin.math.abs
          import kotlin.math.hypot

          /** Point normalisé (0..1) dans le repère de l'image. */
          data class Pt(val x: Float, val y: Float) {
              /** Distance euclidienne vers [o]. */
              fun dist(o: Pt): Float = hypot(x - o.x, y - o.y)
          }

          /**
           * Quadrilatère d'un document, coins ordonnés : haut-gauche, haut-droite,
           * bas-droite, bas-gauche. Les coordonnées sont normalisées (0..1).
           */
          data class Quad(val tl: Pt, val tr: Pt, val br: Pt, val bl: Pt) {

              /** Liste des 4 coins dans l'ordre horaire. */
              val points: List<Pt> get() = listOf(tl, tr, br, bl)

              /** Remplace le coin d'index [i] (0..3). */
              fun withPoint(i: Int, p: Pt): Quad = when (i) {
                  0 -> copy(tl = p)
                  1 -> copy(tr = p)
                  2 -> copy(br = p)
                  else -> copy(bl = p)
              }

              /** Aire du quadrilatère (formule du lacet). */
              fun area(): Float {
                  val p = points
                  var s = 0f
                  for (i in p.indices) {
                      val a = p[i]
                      val b = p[(i + 1) % p.size]
                      s += a.x * b.y - b.x * a.y
                  }
                  return abs(s) / 2f
              }

              /** Sérialisation JSON : [[x,y],[x,y],[x,y],[x,y]]. */
              fun toJson(): String = points.joinToString(",", "[", "]") { "[${it.x},${it.y}]" }

              companion object {
                  /** Cadre par défaut légèrement en retrait des bords. */
                  val FULL_INSET = Quad(Pt(0.04f, 0.04f), Pt(0.96f, 0.04f), Pt(0.96f, 0.96f), Pt(0.04f, 0.96f))

                  /** Cadre couvrant toute l'image. */
                  val FULL = Quad(Pt(0f, 0f), Pt(1f, 0f), Pt(1f, 1f), Pt(0f, 1f))

                  /** Ordonne 4 points quelconques en (tl, tr, br, bl). */
                  fun fromUnordered(pts: List<Pt>): Quad {
                      require(pts.size == 4) { "4 points requis" }
                      val tl = pts.minBy { it.x + it.y }
                      val br = pts.maxBy { it.x + it.y }
                      val rest = pts.filter { it !== tl && it !== br }
                      val others = if (rest.size == 2) rest else pts.filter { it != tl && it != br }.take(2)
                      val tr = others.minBy { it.y - it.x }
                      val bl = others.maxBy { it.y - it.x }
                      return Quad(tl, tr, br, bl)
                  }

                  /** Désérialise le JSON produit par [toJson], ou null si invalide. */
                  fun fromJson(json: String?): Quad? {
                      if (json.isNullOrBlank()) return null
                      val nums = Regex("-?\\d+(\\.\\d+)?([eE]-?\\d+)?").findAll(json).map { it.value.toFloat() }.toList()
                      if (nums.size != 8) return null
                      return Quad(Pt(nums[0], nums[1]), Pt(nums[2], nums[3]), Pt(nums[4], nums[5]), Pt(nums[6], nums[7]))
                  }
              }
          }

