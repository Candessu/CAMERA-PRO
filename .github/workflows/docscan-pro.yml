          package com.docscan.pro.core.cv

          import android.graphics.Bitmap
          import com.docscan.pro.data.model.Quad
          import org.opencv.android.Utils
          import org.opencv.core.Mat
          import org.opencv.core.MatOfPoint2f
          import org.opencv.core.Point
          import org.opencv.core.Size
          import org.opencv.imgproc.Imgproc
          import javax.inject.Inject
          import javax.inject.Singleton
          import kotlin.math.hypot
          import kotlin.math.max
          import kotlin.math.roundToInt

          /** Redressement de perspective : quadrilatère → rectangle. */
          @Singleton
          class PerspectiveCorrector @Inject constructor() {

              /** Redresse [src] selon [quad] (coordonnées normalisées). Ne recycle pas [src]. */
              fun warp(src: Bitmap, quad: Quad): Bitmap {
                  check(OpenCvInit.ensure()) { "OpenCV indisponible" }
                  val w = src.width.toDouble()
                  val h = src.height.toDouble()
                  val p = quad.points.map { Point((it.x * w).coerceIn(0.0, w - 1), (it.y * h).coerceIn(0.0, h - 1)) }
                  val (tl, tr, br, bl) = p
                  val outW = max(dist(br, bl), dist(tr, tl)).roundToInt().coerceAtLeast(16)
                  val outH = max(dist(tr, br), dist(tl, bl)).roundToInt().coerceAtLeast(16)

                  val srcMat = Mat()
                  val dstMat = Mat()
                  val srcPts = MatOfPoint2f(tl, tr, br, bl)
                  val dstPts = MatOfPoint2f(
                      Point(0.0, 0.0), Point(outW - 1.0, 0.0),
                      Point(outW - 1.0, outH - 1.0), Point(0.0, outH - 1.0)
                  )
                  var m: Mat? = null
                  try {
                      Utils.bitmapToMat(src, srcMat)
                      m = Imgproc.getPerspectiveTransform(srcPts, dstPts)
                      Imgproc.warpPerspective(srcMat, dstMat, m, Size(outW.toDouble(), outH.toDouble()), Imgproc.INTER_CUBIC)
                      val out = Bitmap.createBitmap(dstMat.cols(), dstMat.rows(), Bitmap.Config.ARGB_8888)
                      Utils.matToBitmap(dstMat, out)
                      return out
                  } finally {
                      srcMat.release(); dstMat.release(); srcPts.release(); dstPts.release(); m?.release()
                  }
              }

              private fun dist(a: Point, b: Point) = hypot(a.x - b.x, a.y - b.y)
          }
