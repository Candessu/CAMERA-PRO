                          fileStore.saveJpeg(bmp, File(path), 95)
                          val det = detect(bmp)
                          // Cadrage automatique seulement si un document est vraiment trouvé
                          // (sur la photo, ou vu en direct au moment du déclenchement).
                          // Sinon rien n'est forcé : la photo reste entière, sans filtre.
                          val quad: Quad? = when {
                              det != null && det.confidence >= 0.6f -> det.quad
                              hint != null -> hint
                              else -> null
                          }
                          val filter = if (quad != null) settings.current().defaultFilter else ScanFilter.ORIGINAL
                          val warped = if (quad != null) corrector.warp(bmp, quad) else bmp.copy(Bitmap.Config.ARGB_8888, false)
                          val processed = enhancer.apply(warped, filter)
                          val warpedPath = fileStore.saveJpeg(warped, fileStore.newImageFile("warp"), 97)
                          val processedPath = fileStore.saveJpeg(processed, fileStore.newImageFile("proc"), 95)
                          warped.recycle(); processed.recycle()
                          DraftPage(UUID.randomUUID().toString(), path, warpedPath, processedPath, filter, quad ?: Quad.FULL)
                      } finally {
