              /** Fichier PDF lisible : direct, ou déchiffré dans le cache si protégé. */
              suspend fun readablePdf(doc: Document): File = withContext(Dispatchers.IO) {
                  val path = requireNotNull(doc.pdfPath) { "PDF introuvable" }
                  val src = File(path)
                  require(src.exists()) { "PDF introuvable" }
                  if (!doc.isProtected) src
                  else fileStore.shareFile(doc.name).also { crypto.decrypt(src, it) }
              }

              private fun DocumentWithPages.toModel(): Document = Document(
                  id = document.id,
                  name = document.name,
                  createdAt = document.createdAt,
                  updatedAt = document.updatedAt,
                  type = DocumentType.values().firstOrNull { it.name == document.type } ?: DocumentType.IMPRIME,
                  pdfPath = document.pdfPath,
                  isProtected = document.isProtected,
                  pages = pages.sortedBy { it.pageIndex }.map { p ->
                      Page(
                          id = p.id, documentId = p.documentId, pageIndex = p.pageIndex,
                          originalPath = p.originalPath, processedPath = p.processedPath,
                          filter = ScanFilter.values().firstOrNull { it.name == p.filter } ?: ScanFilter.DOCUMENT,
                          quad = Quad.fromJson(p.corners)
                      )
                  }
              )
          }
