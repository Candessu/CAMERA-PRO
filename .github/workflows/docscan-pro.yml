                  val q = Quad.fromUnordered(listOf(Pt(0.9f, 0.9f), Pt(0.1f, 0.1f), Pt(0.1f, 0.9f), Pt(0.9f, 0.1f)))
                  assertEquals(Pt(0.1f, 0.1f), q.tl)
                  assertEquals(Pt(0.9f, 0.1f), q.tr)
                  assertEquals(Pt(0.9f, 0.9f), q.br)
                  assertEquals(Pt(0.1f, 0.9f), q.bl)
              }

              @Test
              fun jsonRoundTrip() {
                  val q = Quad(Pt(0.1f, 0.2f), Pt(0.8f, 0.15f), Pt(0.85f, 0.9f), Pt(0.12f, 0.88f))
                  val back = Quad.fromJson(q.toJson())
                  assertNotNull(back)
                  assertEquals(q, back)
              }

              @Test
              fun areaOfUnitSquare() {
                  assertEquals(1f, Quad.FULL.area(), 1e-6f)
              }
          }

          class AutoCaptureUseCaseTest {
              private fun frame(t: Long, q: Quad?, conf: Float = 0.9f, sharp: Double = 100.0) =
                  FrameResult(q?.let { Detection(it, conf) }, 480, 640, sharp, t)

              @Test
              fun triggersAfterHoldWhenStableAndSharp() {
                  val uc = AutoCaptureUseCase()
                  var last = uc.onFrame(frame(0, Quad.FULL_INSET))
                  var t = 0L
                  while (t < 1500 && !last.shouldCapture) {
                      t += 66
                      last = uc.onFrame(frame(t, Quad.FULL_INSET))
                  }
                  assertTrue(last.shouldCapture)
                  assertTrue(t >= 800)
              }

              @Test
              fun doesNotTriggerWhenBlurry() {
                  val uc = AutoCaptureUseCase()
                  var any = false
                  for (i in 0..30) any = any || uc.onFrame(frame(i * 66L, Quad.FULL_INSET, sharp = 5.0)).shouldCapture
                  assertFalse(any)
              }

              @Test
              fun resetsWhenDocumentLost() {
                  val uc = AutoCaptureUseCase()
                  for (i in 0..8) uc.onFrame(frame(i * 66L, Quad.FULL_INSET))
                  val lost = uc.onFrame(frame(700, null))
                  assertFalse(lost.detected)
                  assertEquals(0f, lost.progress, 0f)
              }
          }
          DSP_EOF_45
          echo "Fichiers generes :"; find . -type f | wc -l

      - name: Preparer le keystore (cree une fois, puis reutilise)
        run: |
          set -e
          mkdir -p .signing
          if [ ! -f .signing/docscan-release.jks ]; then
            keytool -genkeypair -v -keystore .signing/docscan-release.jks \
              -alias docscan -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass docscan2026 -keypass docscan2026 \
              -dname "CN=DocScan Pro, O=DocScan, C=MG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .signing/docscan-release.jks
            git commit -m "Keystore DocScan Pro [skip ci]" || true
            git push || echo "Keystore non pousse : il sera recree au prochain build"
          fi
          cp .signing/docscan-release.jks docscan-pro/app/release.jks

      - name: Compiler l'APK release signee
        working-directory: docscan-pro
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease --no-daemon --stacktrace

      - name: Renommer l'APK
        run: |
          mkdir -p out
          cp docscan-pro/app/build/outputs/apk/release/app-release.apk out/DocScanPro-v1.4.1.apk
          ls -lh out

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: DocScanPro-APK
          path: out/DocScanPro-v1.4.1.apk
          retention-days: 30

      - name: Tests unitaires (optionnel)
        continue-on-error: true
        working-directory: docscan-pro
        run: gradle testReleaseUnitTest --no-daemon

      - name: Lint (optionnel)
        continue-on-error: true
        working-directory: docscan-pro
        run: gradle lintRelease --no-daemon
