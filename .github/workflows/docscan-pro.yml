               * Renvoie le chemin où la photo doit être écrite, ou null si une capture est déjà en cours.
               */
              fun startSystemCapture(): String? {
                  if (captureInFlight) return null
                  captureInFlight = true
                  _state.update { it.copy(processing = true) }
                  return fileStore.newCaptureFile().absolutePath
              }

              /** Retour de l'appareil photo du téléphone : recadrage automatique si une photo a été prise. */
              fun onSystemCaptureResult(path: String, ok: Boolean) {
                  if (ok && java.io.File(path).length() > 0) {
                      onDocumentSaved(path, useLiveHint = false)
                  } else {
                      fileStore.deleteQuietly(path)
                      finishCapture()
                  }
              }

              /** Mode Documents : photo enregistrée par CameraX, recadrage automatique. */
              fun onDocumentSaved(path: String, useLiveHint: Boolean = true) {
                  val hint = if (useLiveHint) lastQuad else null
                  viewModelScope.launch {
                      when (val r = processCapture(path, hint)) {
                          is AppResult.Success -> {
                              session.add(r.data)
                              _events.send(CameraEvent.OpenEditor)
                          }
                          is AppResult.Error -> {
                              fileStore.deleteQuietly(path)
                              _events.send(CameraEvent.Error(r.message))
                          }
                      }
                      finishCapture()
                  }
              }

              /** Mode Documents : échec de la prise de vue. */
              fun onCaptureFailed(message: String) {
                  viewModelScope.launch { _events.send(CameraEvent.Error(message)) }
                  finishCapture()
              }

              /** Image importée depuis la galerie (recadrée comme un document). */
              fun onImport(uri: String) {
                  if (captureInFlight) return
                  captureInFlight = true
                  _state.update { it.copy(processing = true) }
                  viewModelScope.launch {
                      when (val r = processCapture.fromUri(uri)) {
                          is AppResult.Success -> { session.add(r.data); _events.send(CameraEvent.OpenEditor) }
                          is AppResult.Error -> _events.send(CameraEvent.Error(r.message))
                      }
                      finishCapture()
                  }
              }

              /** Bouton flash : torche en Documents, flash Éteint/Auto/Allumé en Photo. */
              fun onFlashClick() {
                  if (_state.value.mode != CameraMode.PHOTO) {
                      _state.update { it.copy(torchOn = !it.torchOn) }
                  } else {
                      _state.update {
                          val next = FlashSetting.values()[(it.flash.ordinal + 1) % FlashSetting.values().size]
                          it.copy(flash = next)
                      }
                  }
              }

              /** Caméra avant / arrière (modes Photo et Vidéo, hors enregistrement). */
              fun switchLens() {
                  val st = _state.value
                  if (st.mode != CameraMode.DOCUMENT && !st.recording && !st.videoBusy) _state.update { it.copy(front = !it.front) }
              }

              /** Active / désactive la détection des visages (bouton du mode Photo). */
              fun toggleFaces() {
                  val v = !_state.value.faceDetection
                  if (!v) _state.update { it.copy(faces = emptyList()) }
                  viewModelScope.launch { settings.setFaceDetection(v) }
              }

              /** Bascule de la capture automatique. */
              fun toggleAuto() {
                  val v = !_state.value.autoCapture
                  viewModelScope.launch { settings.setAutoCapture(v) }
              }

              private fun finishCapture() {
                  autoCapture.reset()
                  captureInFlight = false
                  _state.update { it.copy(processing = false, progress = 0f) }
              }

              /** Lissage exponentiel des coins pour un tracé fluide. */
              private fun smooth(a: Quad, b: Quad, k: Float = 0.5f): Quad {
                  fun m(p: Pt, q: Pt) = Pt(p.x + (q.x - p.x) * k, p.y + (q.y - p.y) * k)
                  return Quad(m(a.tl, b.tl), m(a.tr, b.tr), m(a.br, b.br), m(a.bl, b.bl))
              }
          }
