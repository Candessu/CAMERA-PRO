          /**
           * Analyseur CameraX unique, aiguillé selon le mode :
           * - Documents : plan Y (YUV_420_888) → Mat gris, rotation, 640 px, détection du document (~15 im/s) ;
           * - Photo : détection des visages ML Kit ([faceAnalyzer]) si [faceEnabled].
           */
          class FrameAnalyzer(
              private val detector: DocumentDetector,
              private val enabled: () -> Boolean = { true },
              private val faceAnalyzer: FaceAnalyzer? = null,
              private val faceEnabled: () -> Boolean = { false },
              private val onResult: (FrameResult) -> Unit
          ) : ImageAnalysis.Analyzer {

              private var lastRun = 0L
              private var buffer = ByteArray(0)

              override fun analyze(image: ImageProxy) {
                  if (faceAnalyzer != null && faceEnabled()) {
                      // L'analyseur de visages ferme l'image lui-même quand ML Kit a terminé.
                      val taken = try { faceAnalyzer.analyze(image) } catch (e: Throwable) { false }
                      if (!taken) image.close()
                      return
                  }
                  try {
                      val now = System.currentTimeMillis()
                      if (!enabled() || now - lastRun < MIN_INTERVAL_MS || !OpenCvInit.ensure()) return
                      lastRun = now
