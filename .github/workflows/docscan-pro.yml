          /** Recadrage manuel : 4 poignées déplaçables sur l'image originale. */
          @Composable
          private fun CropEditor(page: DraftPage, onCancel: () -> Unit, onApply: (Quad) -> Unit) {
              var quad by remember(page.id) { mutableStateOf(page.quad) }
              var active by remember { mutableStateOf(-1) }
              val (imgW, imgH) = remember(page.originalPath) {
                  val o = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  BitmapFactory.decodeFile(page.originalPath, o)
                  (o.outWidth.coerceAtLeast(1)) to (o.outHeight.coerceAtLeast(1))
              }
              val density = LocalDensity.current

              Column(Modifier.fillMaxSize()) {
                  BoxWithConstraints(Modifier.weight(1f).fillMaxWidth().padding(20.dp)) {
                      val boxW = with(density) { maxWidth.toPx() }
                      val boxH = with(density) { maxHeight.toPx() }
                      val scale = min(boxW / imgW, boxH / imgH)
                      val drawW = imgW * scale
                      val drawH = imgH * scale
                      val left = (boxW - drawW) / 2f
                      val top = (boxH - drawH) / 2f

                      fun toScreen(p: Pt) = Offset(left + p.x * drawW, top + p.y * drawH)
                      fun toNorm(o: Offset) = Pt(((o.x - left) / drawW).coerceIn(0f, 1f), ((o.y - top) / drawH).coerceIn(0f, 1f))

                      AsyncImage(
                          model = File(page.originalPath),
                          contentDescription = null,
                          contentScale = ContentScale.Fit,
                          modifier = Modifier.fillMaxSize()
                      )
                      Canvas(
                          Modifier.fillMaxSize().pointerInput(page.id, drawW, drawH) {
                              detectDragGestures(
                                  onDragStart = { start ->
                                      val pts = quad.points.map { toScreen(it) }
                                      val nearest = pts.indices.minBy { (pts[it] - start).getDistance() }
                                      active = if ((pts[nearest] - start).getDistance() < 72.dp.toPx()) nearest else -1
                                  },
                                  onDragEnd = { active = -1 },
                                  onDragCancel = { active = -1 },
                                  onDrag = { change, drag ->
                                      if (active >= 0) {
                                          change.consume()
                                          val cur = toScreen(quad.points[active])
                                          quad = quad.withPoint(active, toNorm(cur + drag))
                                      }
                                  }
                              )
                          }
                      ) {
                          val pts = quad.points.map { toScreen(it) }
                          val path = Path().apply {
                              moveTo(pts[0].x, pts[0].y)
                              for (i in 1..3) lineTo(pts[i].x, pts[i].y)
                              close()
                          }
                          drawPath(path, ScanGreen.copy(alpha = 0.15f))
                          drawPath(path, ScanGreen, style = Stroke(3.dp.toPx()))
                          pts.forEachIndexed { i, o ->
                              drawCircle(Color.White, if (i == active) 16.dp.toPx() else 12.dp.toPx(), o)
                              drawCircle(ScanGreen, if (i == active) 16.dp.toPx() else 12.dp.toPx(), o, style = Stroke(3.dp.toPx()))
                          }
                      }
                  }
                  Row(
                      Modifier.fillMaxWidth().background(MaterialTheme.colorScheme.surface).padding(12.dp),
                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      TextButton(onClick = { quad = Quad.FULL }) { Text(stringResource(R.string.action_full_page)) }
                      Spacer(Modifier.weight(1f))
                      OutlinedButton(onClick = onCancel) { Text(stringResource(R.string.action_cancel)) }
                      Button(onClick = { onApply(quad) }) { Text(stringResource(R.string.action_apply)) }
                  }
                  Spacer(Modifier.height(4.dp))
              }
          }
