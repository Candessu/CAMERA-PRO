                  }
                  composable(Screen.Library.route) {
                      LibraryScreen(
                          onBack = { nav.popBackStack() },
                          onScan = { nav.popBackStack(Screen.Camera.route, inclusive = false) }
                      )
                  }
                  composable(Screen.Settings.route) {
                      SettingsScreen(onBack = { nav.popBackStack() })
                  }
              }
          }
