          package com.docscan.pro.core.utils

          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Matrix
          import androidx.exifinterface.media.ExifInterface
          import kotlin.math.max
          import kotlin.math.roundToInt

          /** Utilitaires de décodage et de transformation de bitmaps. */
          object BitmapUtils {

              /** Côté long maximal conservé pour les captures (≈ 12,5 Mpx en 4:3). */
              const val MAX_SIDE = 4096

              /** Décode [path] en ARGB_8888, applique l'orientation EXIF et limite à [maxSide]. */
              fun decodeOriented(path: String, maxSide: Int = MAX_SIDE): Bitmap {
                  val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  BitmapFactory.decodeFile(path, bounds)
                  require(bounds.outWidth > 0 && bounds.outHeight > 0) { "Image illisible" }
                  // Sous-échantillonnage tant que l'image reste ≥ 1,5 × la cible (évite les bitmaps géants en 50/108 Mpx).
                  var sample = 1
                  while (max(bounds.outWidth, bounds.outHeight) / (sample * 2) >= maxSide * 3 / 4) sample *= 2
                  val opts = BitmapFactory.Options().apply {
                      inSampleSize = sample
                      inPreferredConfig = Bitmap.Config.ARGB_8888
                  }
                  val raw = requireNotNull(BitmapFactory.decodeFile(path, opts)) { "Décodage impossible" }
                  val rotation = exifRotation(path)
                  val scaled = scaleDown(raw, maxSide)
                  return if (rotation == 0) scaled else rotate(scaled, rotation.toFloat())
              }

              /** Décode sans orientation EXIF (fichiers déjà normalisés par l'app). */
              fun decode(path: String, maxSide: Int = MAX_SIDE): Bitmap = decodeOriented(path, maxSide)

              /** Réduit [src] pour que son côté long soit ≤ [maxSide] (recycle l'original si copie). */
              fun scaleDown(src: Bitmap, maxSide: Int): Bitmap {
                  val long = max(src.width, src.height)
                  if (long <= maxSide) return src
                  val ratio = maxSide.toFloat() / long
                  val out = Bitmap.createScaledBitmap(
                      src, (src.width * ratio).roundToInt().coerceAtLeast(1),
                      (src.height * ratio).roundToInt().coerceAtLeast(1), true
                  )
                  if (out !== src) src.recycle()
                  return out
              }

              /** Copie réduite (ne recycle pas l'original). */
              fun scaledCopy(src: Bitmap, maxSide: Int): Bitmap {
                  val long = max(src.width, src.height)
                  if (long <= maxSide) return src.copy(Bitmap.Config.ARGB_8888, false)
                  val ratio = maxSide.toFloat() / long
                  return Bitmap.createScaledBitmap(
                      src, (src.width * ratio).roundToInt().coerceAtLeast(1),
                      (src.height * ratio).roundToInt().coerceAtLeast(1), true
                  )
              }

              /** Rotation de [degrees] (recycle l'original). */
              fun rotate(src: Bitmap, degrees: Float): Bitmap {
                  val m = Matrix().apply { postRotate(degrees) }
                  val out = Bitmap.createBitmap(src, 0, 0, src.width, src.height, m, true)
                  if (out !== src) src.recycle()
                  return out
              }

              private fun exifRotation(path: String): Int = try {
                  when (ExifInterface(path).getAttributeInt(
                      ExifInterface.TAG_ORIENTATION, ExifInterface.ORIENTATION_NORMAL
                  )) {
                      ExifInterface.ORIENTATION_ROTATE_90 -> 90
                      ExifInterface.ORIENTATION_ROTATE_180 -> 180
                      ExifInterface.ORIENTATION_ROTATE_270 -> 270
                      else -> 0
                  }
              } catch (e: Exception) {
                  0
              }
          }
