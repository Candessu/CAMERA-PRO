          object BiometricAuth {
              private const val AUTHENTICATORS =
                  BiometricManager.Authenticators.BIOMETRIC_WEAK or BiometricManager.Authenticators.DEVICE_CREDENTIAL

              /** Lance l'authentification ; [onSuccess] est appelé uniquement en cas de succès. */
              fun authenticate(context: Context, onSuccess: () -> Unit, onError: (String) -> Unit) {
                  val activity = context.findActivity() as? FragmentActivity
                  if (activity == null) {
                      onError(context.getString(R.string.error_auth_unavailable)); return
                  }
                  val can = BiometricManager.from(activity).canAuthenticate(AUTHENTICATORS)
                  if (can != BiometricManager.BIOMETRIC_SUCCESS) {
                      onError(context.getString(R.string.error_auth_unavailable)); return
                  }
                  val prompt = BiometricPrompt(
                      activity, ContextCompat.getMainExecutor(activity),
                      object : BiometricPrompt.AuthenticationCallback() {
                          override fun onAuthenticationSucceeded(result: BiometricPrompt.AuthenticationResult) = onSuccess()
                          override fun onAuthenticationError(errorCode: Int, errString: CharSequence) =
                              onError(errString.toString())
                      }
                  )
                  val info = BiometricPrompt.PromptInfo.Builder()
                      .setTitle(activity.getString(R.string.auth_title))
                      .setSubtitle(activity.getString(R.string.auth_subtitle))
                      .setAllowedAuthenticators(AUTHENTICATORS)
                      .build()
                  prompt.authenticate(info)
              }
          }

