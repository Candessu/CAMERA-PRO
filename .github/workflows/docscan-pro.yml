              private val _state = MutableStateFlow(CameraUiState())
              val state: StateFlow<CameraUiState> = _state.asStateFlow()

              private val _events = Channel<CameraEvent>(Channel.BUFFERED)
              val events = _events.receiveAsFlow()

              @Volatile private var lastQuad: Quad? = null
              @Volatile private var captureInFlight = false

              init {
                  viewModelScope.launch {
                      val mode = settings.current().lastMode
                      _state.update { it.copy(mode = mode) }
                  }
                  viewModelScope.launch {
                      settings.settings.collect { s ->
                          _state.update {
                              it.copy(
                                  autoCapture = s.autoCapture,
                                  photoDest = s.photoDest,
                                  photoTreeUri = s.photoTreeUri,
                                  lastPhoto = it.lastPhoto ?: s.lastPhotoUri,
                                  lastIsVideo = if (it.lastPhoto == null) s.lastMediaIsVideo else it.lastIsVideo,
                                  videoQuality = s.videoQuality,
                                  faceDetection = s.faceDetection,
                                  faces = if (s.faceDetection) it.faces else emptyList()
                              )
                          }
                      }
