          /** Chiffrement AES-256-GCM des documents sensibles (Android Keystore). */
          @Singleton
          class CryptoManager @Inject constructor(@ApplicationContext private val context: Context) {

              private val masterKeyAlias: String by lazy { MasterKeys.getOrCreate(MasterKeys.AES256_GCM_SPEC) }

              private fun encrypted(file: File): EncryptedFile = EncryptedFile.Builder(
                  file, context, masterKeyAlias, EncryptedFile.FileEncryptionScheme.AES256_GCM_HKDF_4KB
              ).build()

              /** Chiffre [plain] vers [target] (écrase si présent). */
              fun encrypt(plain: File, target: File) {
                  if (target.exists()) target.delete()
                  encrypted(target).openFileOutput().use { out -> plain.inputStream().use { it.copyTo(out) } }
              }

              /** Déchiffre [source] vers [target]. */
              fun decrypt(source: File, target: File) {
                  if (target.exists()) target.delete()
                  encrypted(source).openFileInput().use { input -> target.outputStream().use { input.copyTo(it) } }
              }
          }
