           * Environ 8 analyses/s ; rectangles normalisés (0..1) dans l'image redressée.
           */
          class FaceAnalyzer(private val onFaces: (FaceResult) -> Unit) {

              private val detector = FaceDetection.getClient(
                  FaceDetectorOptions.Builder()
                      .setPerformanceMode(FaceDetectorOptions.PERFORMANCE_MODE_FAST)
                      .setMinFaceSize(0.1f)
                      .enableTracking()
                      .build()
              )

