# DocScan Pro - APK Android native (scanner de documents)
# Copier ce fichier dans GitHub : .github/workflows/docscan-pro.yml
# Puis onglet Actions > "DocScan Pro - Build APK" > Run workflow.
# L'APK signee se telecharge dans Artifacts : DocScanPro-APK
name: DocScan Pro - Build APK

on:
  push:
    branches: [ main, master ]
    paths-ignore: [ ".signing/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparer le SDK Android (deja present sur le serveur)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          ls "$SDK/platforms" || true
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          yes | "$SM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || echo "Installation SDK partielle, Gradle completera"
          ls "$SDK/platforms" "$SDK/build-tools" || true

      - name: Installer Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Generer le projet DocScan Pro
        run: |
          set -e
          rm -rf docscan-pro
          mkdir -p docscan-pro
          cd docscan-pro
          cat > 'README.md' << 'DSP_EOF_0'
          # DocScan Pro

          Scanner de documents Android natif (Kotlin, Jetpack Compose, CameraX, OpenCV 4.9, ML Kit OCR).
          Traitement 100 % sur l'appareil.

          ## Pipeline CV

          ```
          CameraX (YUV_420_888, 640x480, ~15 fps)
            -> plan Y -> Mat gris -> rotation -> FrameAnalyzer
            -> DocumentDetector : flou 5x5 -> Canny adaptatif -> fermeture 3x3
               -> contours externes -> approxPolyDP (4 sommets, aire > 25 %)
               -> tri des coins -> confiance (rectangularité, angles, aire, contraste)
            -> AutoCaptureUseCase : stable 5 frames + net + 800 ms -> capture
            -> PerspectiveCorrector : getPerspectiveTransform + warpPerspective
            -> ImageEnhancer : DOCUMENT (CLAHE + Sauvola), MANUSCRIT, DESSIN, N&B (Otsu), COULEUR
            -> PdfExporter (PdfDocument natif) -> Room + fichiers
          ```

          ## Build

          GitHub Actions construit l'APK release signée (`gradle assembleRelease`).
          Le keystore est créé au premier build dans `.signing/` et réutilisé ensuite,
          pour que les mises à jour s'installent par-dessus l'ancienne version.
          DSP_EOF_0
          cat > 'build.gradle.kts' << 'DSP_EOF_1'
          plugins {
              id("com.android.application") version "8.3.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
              id("org.jetbrains.kotlin.kapt") version "1.9.23" apply false
              id("com.google.dagger.hilt.android") version "2.51.1" apply false
          }
          DSP_EOF_1
          cat > 'gradle.properties' << 'DSP_EOF_2'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          kapt.use.worker.api=true
          DSP_EOF_2
          cat > 'settings.gradle.kts' << 'DSP_EOF_3'
          pluginManagement {
              repositories {
