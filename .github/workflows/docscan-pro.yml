                  val med = Mat()
                  Imgproc.medianBlur(small, med, 21)
                  Imgproc.GaussianBlur(med, med, Size(0.0, 0.0), 3.0)
                  val bg = Mat()
                  Imgproc.resize(med, bg, gray.size(), 0.0, 0.0, Imgproc.INTER_LINEAR)
                  val out = Mat()
                  Core.divide(gray, bg, out, 255.0)
                  small.release(); med.release(); kernel.release(); bg.release()
                  return out
              }

              private fun removeShadowColor(rgb: Mat): Mat {
                  val ch = ArrayList<Mat>()
                  Core.split(rgb, ch)
                  val flat = ch.map { c -> removeShadow(c).also { c.release() } }
                  val out = Mat()
                  Core.merge(flat, out)
                  flat.forEach { it.release() }
                  return out
              }

              /** Balance des blancs « gray world ». */
              private fun whiteBalance(rgb: Mat): Mat {
                  val mean = Core.mean(rgb).`val`
                  val avg = (mean[0] + mean[1] + mean[2]) / 3.0
                  val ch = ArrayList<Mat>()
                  Core.split(rgb, ch)
                  for (i in 0 until 3) {
                      val gain = if (mean[i] > 1) (avg / mean[i]).coerceIn(0.7, 1.4) else 1.0
                      ch[i].convertTo(ch[i], -1, gain, 0.0)
                  }
                  val out = Mat()
                  Core.merge(ch, out)
                  ch.forEach { it.release() }
                  return out
              }

              /** Masque flou (unsharp mask). */
              private fun unsharp(src: Mat, sigma: Double, amount: Double): Mat {
                  val blur = Mat()
                  Imgproc.GaussianBlur(src, blur, Size(0.0, 0.0), sigma)
                  val out = Mat()
                  Core.addWeighted(src, 1.0 + amount, blur, -amount, 0.0, out)
                  blur.release()
                  return out
              }

              /**
               * Binarisation de Sauvola : T = m · (1 + k · (s / R − 1)),
               * m et s = moyenne et écart-type locaux sur une fenêtre [win].
               */
              private fun sauvola(gray: Mat, win: Int, k: Double, r: Double): Mat {
                  val f = Mat(); gray.convertTo(f, CvType.CV_32F)
                  val size = Size(win.toDouble(), win.toDouble())
                  val mean = Mat(); Imgproc.boxFilter(f, mean, -1, size)
                  val sq = Mat(); Core.multiply(f, f, sq)
                  val sqMean = Mat(); Imgproc.boxFilter(sq, sqMean, -1, size); sq.release()
                  val meanSq = Mat(); Core.multiply(mean, mean, meanSq)
                  val variance = Mat(); Core.subtract(sqMean, meanSq, variance); sqMean.release(); meanSq.release()
                  Core.max(variance, Scalar(0.0), variance)
                  val std = Mat(); Core.sqrt(variance, std); variance.release()
                  val term = Mat(); Core.multiply(mean, std, term, k / r); std.release()
                  val thr = Mat(); Core.addWeighted(mean, 1.0 - k, term, 1.0, 0.0, thr); mean.release(); term.release()
                  val out = Mat(); Core.compare(f, thr, out, Core.CMP_GT)
                  f.release(); thr.release()
                  return out
              }

              private fun windowFor(m: Mat): Int {
                  var w = (min(m.cols(), m.rows()) / 40).coerceIn(15, 61)
                  if (w % 2 == 0) w++
                  return w
              }
          }
