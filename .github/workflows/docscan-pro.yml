          package com.docscan.pro.domain.usecase

          import com.docscan.pro.data.model.FrameResult
          import com.docscan.pro.data.model.Quad
          import javax.inject.Inject
          import kotlin.math.sqrt

          /** État de la capture automatique pour une frame. */
          data class AutoCaptureState(
              val detected: Boolean,
              val stable: Boolean,
              val sharp: Boolean,
              /** Progression 0..1 vers le déclenchement. */
              val progress: Float,
              val shouldCapture: Boolean
          )

          /**
           * Décide du déclenchement automatique : document détecté (confiance ≥ seuil),
           * stable (variance des coins sur 5 frames < seuil), net, pendant [holdMs] ms.
           * Pur Kotlin : testable sans Android. Non thread-safe (appelé depuis le thread d'analyse).
           */
          class AutoCaptureUseCase @Inject constructor() {

              var confidenceThreshold = 0.7f
              var stdThreshold = 0.012f
              var sharpnessThreshold = 35.0
              var holdMs = 800L

              private val history = ArrayDeque<Quad>()
              private var stableSince = -1L

              /** Met à jour l'état avec une nouvelle frame. */
              @Synchronized
              fun onFrame(frame: FrameResult): AutoCaptureState {
                  val det = frame.detection
                  if (det == null || det.confidence < confidenceThreshold) {
                      history.clear(); stableSince = -1L
                      return AutoCaptureState(false, false, false, 0f, false)
                  }
                  history.addLast(det.quad)
                  while (history.size > WINDOW) history.removeFirst()
                  val stable = history.size >= WINDOW && maxStd(history) < stdThreshold
                  val sharp = frame.sharpness >= sharpnessThreshold
                  if (stable && sharp) {
                      if (stableSince < 0) stableSince = frame.timestampMs
                  } else {
                      stableSince = -1L
                  }
                  val elapsed = if (stableSince < 0) 0L else frame.timestampMs - stableSince
                  val progress = (elapsed.toFloat() / holdMs).coerceIn(0f, 1f)
                  return AutoCaptureState(true, stable, sharp, progress, progress >= 1f)
              }

              /** Réinitialise l'historique (après une capture). */
              @Synchronized
              fun reset() {
                  history.clear(); stableSince = -1L
              }

              private fun maxStd(quads: Collection<Quad>): Float {
                  var worst = 0f
                  for (corner in 0 until 4) {
                      val xs = quads.map { it.points[corner].x }
                      val ys = quads.map { it.points[corner].y }
                      worst = maxOf(worst, std(xs), std(ys))
                  }
                  return worst
              }

              private fun std(v: List<Float>): Float {
                  val m = v.average().toFloat()
                  return sqrt(v.sumOf { ((it - m) * (it - m)).toDouble() }.toFloat() / v.size)
              }

              private companion object {
                  const val WINDOW = 5
              }
          }
