          enum class CameraMode { DOCUMENT, VIDEO, PHOTO }

          /** Réglage du flash en mode Photo. */
          enum class FlashSetting { OFF, AUTO, ON }

          /**
           * Qualité vidéo : résolution + débit cible (bits/s).
           * Le débit maîtrisé donne une image nette pour un fichier 3 à 5 fois plus léger
           * que l'enregistrement par défaut du téléphone (~17 Mbit/s en 1080p).
           */
          enum class VideoQuality(val height: Int, val bitRate: Int) {
              /** Le plus petit format standard de CameraX est 480p ; avec 1 Mbit/s le poids est celui d'une vidéo 360p. */
              TINY(480, 1_000_000),
              LIGHT(720, 3_000_000),
              BALANCED(1080, 6_000_000),
              HIGH(1080, 10_000_000);

              /** Taille estimée en Mo par minute (image + son). */
              val mbPerMinute: Int get() = ((bitRate + 128_000) * 60L / 8 / 1_000_000).toInt()
          }

