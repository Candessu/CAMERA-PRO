                          val prefs = settings.current()
                          pages.forEachIndexed { i, p ->
                              val suffix = if (pages.size > 1) "_${i + 1}" else ""
                              gallery.saveToGallery(File(p.processedPath), base + suffix, prefs.photoDest, prefs.photoTreeUri)
                          }
                          session.clear(deleteFiles = true)
                          return@resultOf 0L
                      }
                      val images = pages.map { it.processedPath }
                      val name = FileStore.sanitize(req.name)
                      val target = if (req.protect) {
                          val tmp = fileStore.tempFile("export_tmp.pdf")
                          exporter.export(images, tmp, req.quality)
                          val enc = fileStore.uniqueSecureFile(name)
                          crypto.encrypt(tmp, enc)
