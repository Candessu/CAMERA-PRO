              /** La détection des visages ne tourne qu'en mode Photo (si activée). */
              fun faceAnalysisEnabled(): Boolean {
                  val s = _state.value
                  return s.mode == CameraMode.PHOTO && s.faceDetection && !s.photoBusy
              }

              /** Visages détectés (thread ML Kit). */
              fun onFaces(result: FaceResult) {
                  if (!faceAnalysisEnabled()) return
                  _state.update {
                      it.copy(faces = result.faces, faceFrameWidth = result.frameWidth, faceFrameHeight = result.frameHeight)
                  }
              }

              /** Change de mode. */
              fun setMode(mode: CameraMode) {
                  if (mode == _state.value.mode || captureInFlight || _state.value.recording || _state.value.videoBusy) return
                  autoCapture.reset()
                  lastQuad = null
                  _state.update {
                      it.copy(
                          mode = mode, quad = null, detected = false, stable = false, progress = 0f, faces = emptyList(),
                          torchOn = false, front = if (mode == CameraMode.DOCUMENT) false else it.front
                      )
                  }
                  viewModelScope.launch { settings.setLastMode(mode) }
              }

              /** Glissement horizontal : mode suivant (+1) ou précédent (-1). */
              fun swipeMode(delta: Int) {
                  val all = CameraMode.values()
                  val i = (all.indexOf(_state.value.mode) + delta).coerceIn(0, all.size - 1)
                  setMode(all[i])
              }

              /** Appelé depuis le thread d'analyse pour chaque frame. */
              fun onFrame(frame: FrameResult) {
                  if (_state.value.mode != CameraMode.DOCUMENT) return
                  val auto = autoCapture.onFrame(frame)
                  val raw = frame.detection?.quad.takeIf { auto.detected }
                  val smoothed = raw?.let { q -> lastQuad?.let { smooth(it, q) } ?: q }
                  lastQuad = smoothed
                  _state.update {
                      it.copy(
                          quad = smoothed, frameWidth = frame.frameWidth, frameHeight = frame.frameHeight,
                          detected = auto.detected, stable = auto.stable, sharp = auto.sharp,
                          progress = if (it.autoCapture) auto.progress else 0f
                      )
                  }
                  if (auto.shouldCapture && _state.value.autoCapture) requestCapture()
              }

