              fun onRecordingStatus(seconds: Long, bytes: Long) =
                  _state.update { it.copy(recordSeconds = seconds, recordBytes = bytes) }

              /** Mode Vidéo : vidéo enregistrée. */
              fun onVideoSaved(uri: String?) {
                  _state.update { it.copy(recording = false, videoBusy = false, lastPhoto = uri ?: it.lastPhoto, lastIsVideo = if (uri != null) true else it.lastIsVideo) }
                  if (uri != null) viewModelScope.launch { settings.setLastPhoto(uri, isVideo = true) }
              }

              /** Mode Vidéo : échec. */
              fun onVideoFailed(message: String) {
