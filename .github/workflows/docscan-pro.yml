                  if (st.mode == CameraMode.VIDEO) {
                      when {
                          st.recording -> viewModelScope.launch { _events.send(CameraEvent.StopVideo) }
                          !st.videoBusy -> {
                              _state.update { it.copy(videoBusy = true) }
                              viewModelScope.launch { _events.send(CameraEvent.StartVideo) }
                          }
                      }
                  } else if (st.mode == CameraMode.DOCUMENT) {
                      requestCapture(focusFirst = true)
                  } else if (!st.photoBusy) {
