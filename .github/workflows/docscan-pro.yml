          /** Événements ponctuels de la caméra. */
          sealed interface CameraEvent {
              /** Mode Documents : capturer vers [path] puis recadrer. */
              data class Capture(val path: String, val focusFirst: Boolean) : CameraEvent
              /** Mode Photo : prendre une photo vers la galerie. */
              data object TakePhoto : CameraEvent
              /** Mode Vidéo : démarrer / arrêter l'enregistrement. */
              data object StartVideo : CameraEvent
              data object StopVideo : CameraEvent
              data object OpenEditor : CameraEvent
              data class Error(val message: String) : CameraEvent
