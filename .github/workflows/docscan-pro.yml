              private var lastRun = 0L

              /**
               * Lance l'analyse de [image]. Renvoie true si l'image est prise en charge
               * (elle sera fermée à la fin) ; false si l'appelant doit la fermer.
               */
              @OptIn(ExperimentalGetImage::class)
              fun analyze(image: ImageProxy): Boolean {
                  val now = SystemClock.elapsedRealtime()
                  if (busy || now - lastRun < MIN_INTERVAL_MS) return false
                  val media = image.image ?: return false
                  busy = true
                  lastRun = now
                  val rotation = image.imageInfo.rotationDegrees
                  val w = (if (rotation % 180 == 0) image.width else image.height).toFloat()
                  val h = (if (rotation % 180 == 0) image.height else image.width).toFloat()
                  detector.process(InputImage.fromMediaImage(media, rotation))
                      .addOnSuccessListener { faces ->
                          val boxes = faces.map { f ->
                              val r = f.boundingBox
                              FaceBox(
                                  left = (r.left / w).coerceIn(0f, 1f),
                                  top = (r.top / h).coerceIn(0f, 1f),
                                  right = (r.right / w).coerceIn(0f, 1f),
                                  bottom = (r.bottom / h).coerceIn(0f, 1f),
                                  trackingId = f.trackingId
                              )
                          }
                          onFaces(FaceResult(boxes, w.toInt(), h.toInt()))
                      }
                      .addOnCompleteListener {
                          busy = false
                          image.close()
                      }
                  return true
              }

              /** Libère le détecteur. */
              fun close() {
                  runCatching { detector.close() }
              }

              private companion object {
                  const val MIN_INTERVAL_MS = 120L
              }
          }
