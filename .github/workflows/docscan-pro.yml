                  viewModelScope.launch { _events.send(CameraEvent.Error(message)) }
              }

              /** Mode Documents : capture manuelle ou automatique. */
              fun requestCapture(focusFirst: Boolean = false) {
                  if (captureInFlight) return
                  captureInFlight = true
                  _state.update { it.copy(processing = true) }
                  val path = fileStore.newCaptureFile().absolutePath
                  viewModelScope.launch { _events.send(CameraEvent.Capture(path, focusFirst)) }
              }

