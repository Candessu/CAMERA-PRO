              private fun toGrayMat(image: ImageProxy): Mat {
                  val plane = image.planes[0]
                  val w = image.width
                  val h = image.height
                  val rowStride = plane.rowStride
                  val buf = plane.buffer
                  buf.rewind()
                  if (buffer.size != w * h) buffer = ByteArray(w * h)
                  if (rowStride == w) {
                      buf.get(buffer, 0, w * h)
                  } else {
                      for (row in 0 until h) {
                          buf.position(row * rowStride)
                          buf.get(buffer, row * w, w)
                      }
                  }
                  val raw = Mat(h, w, CvType.CV_8UC1)
                  raw.put(0, 0, buffer)

                  val rotated = Mat()
                  when (image.imageInfo.rotationDegrees) {
                      90 -> Core.rotate(raw, rotated, Core.ROTATE_90_CLOCKWISE)
                      180 -> Core.rotate(raw, rotated, Core.ROTATE_180)
                      270 -> Core.rotate(raw, rotated, Core.ROTATE_90_COUNTERCLOCKWISE)
                      else -> raw.copyTo(rotated)
                  }
                  raw.release()

                  val long = max(rotated.cols(), rotated.rows())
                  if (long <= TARGET_SIDE) return rotated
                  val scale = TARGET_SIDE.toDouble() / long
                  val small = Mat()
                  Imgproc.resize(rotated, small, Size(), scale, scale, Imgproc.INTER_AREA)
                  rotated.release()
                  return small
              }

              private companion object {
                  const val MIN_INTERVAL_MS = 66L
                  const val TARGET_SIDE = 640
              }
          }
