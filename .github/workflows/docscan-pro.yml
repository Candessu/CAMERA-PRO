          /** État de l'éditeur. */
          data class EditorUiState(
              val pages: List<DraftPage> = emptyList(),
              val selected: Int = 0,
              val busy: Boolean = false,
              val cropping: Boolean = false,
              val ocrText: String? = null
          ) {
              /** Page sélectionnée (ou null si aucune). */
              val current: DraftPage? get() = pages.getOrNull(selected.coerceIn(0, (pages.size - 1).coerceAtLeast(0)))
          }

          private data class LocalState(val selected: Int = 0, val busy: Boolean = false, val cropping: Boolean = false, val ocr: String? = null)

          /** ViewModel de l'éditeur : filtres, recadrage, rotation, suppression, OCR. */
          @HiltViewModel
          class EditorViewModel @Inject constructor(
              private val session: ScanSession,
              private val enhance: EnhanceImageUseCase,
              private val ocr: OcrEngine
          ) : ViewModel() {

              private val local = MutableStateFlow(LocalState(selected = (session.pages.value.size - 1).coerceAtLeast(0)))

              private val _errors = Channel<String>(Channel.BUFFERED)
              val errors = _errors.receiveAsFlow()

              val state: StateFlow<EditorUiState> = combine(session.pages, local) { pages, l ->
                  EditorUiState(pages, l.selected.coerceIn(0, (pages.size - 1).coerceAtLeast(0)), l.busy, l.cropping, l.ocr)
              }.stateIn(viewModelScope, SharingStarted.Eagerly, EditorUiState(session.pages.value))

              /** Sélectionne la page [i]. */
              fun select(i: Int) = local.update { it.copy(selected = i, cropping = false) }

              /** Applique un filtre à la page courante. */
              fun setFilter(filter: ScanFilter) = edit { enhance.applyFilter(it, filter) }

              /** Pivote la page courante. */
              fun rotate() = edit { enhance.rotate(it) }

              /** Ouvre / ferme le mode recadrage. */
              fun setCropping(on: Boolean) = local.update { it.copy(cropping = on) }

              /** Applique un nouveau cadre. */
              fun applyCrop(quad: Quad) {
                  local.update { it.copy(cropping = false) }
                  edit { enhance.recrop(it, quad) }
              }

              /** Supprime la page courante. */
              fun deleteCurrent() {
                  val page = state.value.current ?: return
                  session.remove(page.id)
                  local.update { it.copy(selected = (it.selected - 1).coerceAtLeast(0)) }
              }

              /** Déplace la page courante vers la gauche / la droite. */
              fun moveCurrent(delta: Int) {
                  val from = state.value.selected
                  val to = from + delta
                  if (to !in state.value.pages.indices) return
                  session.move(from, to)
                  local.update { it.copy(selected = to) }
              }

              /** Reconnaissance de texte de la page courante. */
              fun runOcr() {
                  val page = state.value.current ?: return
                  viewModelScope.launch {
                      local.update { it.copy(busy = true) }
                      when (val r = resultOf { ocr.recognize(page.processedPath) }) {
                          is AppResult.Success -> local.update { it.copy(ocr = r.data) }
                          is AppResult.Error -> _errors.send(r.message)
                      }
                      local.update { it.copy(busy = false) }
                  }
              }

              /** Ferme la fenêtre OCR. */
              fun dismissOcr() = local.update { it.copy(ocr = null) }

              private fun edit(op: suspend (DraftPage) -> AppResult<DraftPage>) {
                  val page = state.value.current ?: return
                  if (local.value.busy) return
                  viewModelScope.launch {
                      local.update { it.copy(busy = true) }
                      when (val r = op(page)) {
                          is AppResult.Success -> session.replace(r.data)
                          is AppResult.Error -> _errors.send(r.message)
                      }
                      local.update { it.copy(busy = false) }
                  }
              }
          }
