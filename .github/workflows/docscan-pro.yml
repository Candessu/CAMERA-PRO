                  _pages.update { list -> list.map { if (it.id == page.id) page else it } }
                  if (old != null) {
                      if (old.processedPath != page.processedPath) fileStore.deleteQuietly(old.processedPath)
                      if (old.warpedPath != page.warpedPath) fileStore.deleteQuietly(old.warpedPath)
                  }
              }

              /** Retire une page et ses fichiers. */
              fun remove(id: String) {
                  val old = _pages.value.firstOrNull { it.id == id } ?: return
                  _pages.update { list -> list.filterNot { it.id == id } }
                  fileStore.deleteQuietly(old.originalPath, old.warpedPath, old.processedPath)
              }

              /** Déplace une page de [from] vers [to]. */
              fun move(from: Int, to: Int) = _pages.update { list ->
                  if (from !in list.indices || to !in list.indices) list
                  else list.toMutableList().apply { add(to, removeAt(from)) }
              }

              /** Vide la session ; [deleteFiles] supprime aussi les images. */
              fun clear(deleteFiles: Boolean) {
                  if (deleteFiles) _pages.value.forEach { fileStore.deleteQuietly(it.originalPath, it.warpedPath, it.processedPath) }
                  _pages.value = emptyList()
              }
          }

          /** Accès aux documents enregistrés (Room + fichiers). */
          @Singleton
          class DocumentRepository @Inject constructor(
              private val dao: DocumentDao,
              private val fileStore: FileStore,
              private val crypto: CryptoManager
          ) {
              /** Flux des documents, plus récents d'abord. */
              fun observeDocuments(): Flow<List<Document>> = dao.observeAll().map { list -> list.map { it.toModel() } }

              /** Enregistre un document et ses pages ; renvoie l'id. */
              suspend fun save(
                  name: String, type: DocumentType, pdfPath: String, isProtected: Boolean, pages: List<DraftPage>
              ): Long = withContext(Dispatchers.IO) {
                  val now = System.currentTimeMillis()
                  val id = dao.insertDocument(
                      DocumentEntity(name = name, createdAt = now, updatedAt = now, type = type.name, pdfPath = pdfPath, isProtected = isProtected)
                  )
                  dao.insertPages(pages.mapIndexed { i, p ->
                      PageEntity(
                          documentId = id, pageIndex = i,
                          originalPath = if (isProtected) "" else p.originalPath,
                          processedPath = if (isProtected) "" else p.processedPath,
                          filter = p.filter.name, corners = p.quad.toJson()
                      )
                  })
                  id
