          /** État de l'écran d'export. */
          data class ExportUiState(
              val name: String = "",
              val nameEdited: Boolean = false,
              val type: DocumentType = DocumentType.IMPRIME,
              val quality: PdfQuality = PdfQuality.MEDIUM,
              val protect: Boolean = false,
              val format: ExportFormat = ExportFormat.PDF,
              val pageCount: Int = 0,
              val exporting: Boolean = false
          )

          /** Événements de l'export. */
          sealed interface ExportEvent {
              data class Done(val toLibrary: Boolean) : ExportEvent
              data class Error(val message: String) : ExportEvent
          }

          /** ViewModel d'export : nommage auto « Scan_yyyyMMdd_HHmmss_TYPE ». */
          @HiltViewModel
          class ExportViewModel @Inject constructor(
              private val exportPdf: ExportPdfUseCase,
              session: ScanSession,
              settings: SettingsRepository
          ) : ViewModel() {

              private val stamp = LocalDateTime.now().format(DateTimeFormatter.ofPattern("yyyyMMdd_HHmmss"))
              private val _state = MutableStateFlow(
                  ExportUiState(name = autoName(DocumentType.IMPRIME), pageCount = session.pages.value.size)
              )
              val state: StateFlow<ExportUiState> = _state.asStateFlow()

              private val _events = Channel<ExportEvent>(Channel.BUFFERED)
              val events = _events.receiveAsFlow()

              init {
                  viewModelScope.launch { _state.update { it.copy(quality = settings.current().pdfQuality) } }
              }

              private fun autoName(type: DocumentType) = "Scan_${stamp}_${type.name}"

              fun setName(v: String) = _state.update { it.copy(name = v, nameEdited = true) }
              fun setType(t: DocumentType) = _state.update {
                  it.copy(type = t, name = if (it.nameEdited) it.name else autoName(t))
              }
              fun setQuality(q: PdfQuality) = _state.update { it.copy(quality = q) }
              fun setProtect(p: Boolean) = _state.update { it.copy(protect = p) }
              fun setFormat(f: ExportFormat) = _state.update {
                  it.copy(format = f, protect = if (f == ExportFormat.JPG) false else it.protect)
              }

              /** Lance l'export PDF. */
              fun export() {
                  val s = _state.value
                  if (s.exporting) return
                  _state.update { it.copy(exporting = true) }
                  viewModelScope.launch {
                      when (val r = exportPdf(ExportRequest(s.name.ifBlank { autoName(s.type) }, s.type, s.quality, s.protect, s.format))) {
                          is AppResult.Success -> _events.send(ExportEvent.Done(toLibrary = s.format == ExportFormat.PDF))
                          is AppResult.Error -> _events.send(ExportEvent.Error(r.message))
                      }
                      _state.update { it.copy(exporting = false) }
                  }
              }
          }

