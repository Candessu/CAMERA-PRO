                      Text(
                          stringResource(
                              if (permission.status.shouldShowRationale) R.string.camera_permission_rationale
                              else R.string.camera_permission_text
                          ),
                          style = MaterialTheme.typography.bodyMedium
                      )
                      Spacer(Modifier.height(16.dp))
                      Button(onClick = { permission.launchPermissionRequest() }) { Text(stringResource(R.string.action_allow)) }
                      Spacer(Modifier.height(8.dp))
                      Button(onClick = onLibrary) { Text(stringResource(R.string.library_title)) }
                  }
              }
          }

          @OptIn(ExperimentalPermissionsApi::class)
          @SuppressLint("ClickableViewAccessibility")
          @Composable
          private fun CameraContent(
              vm: CameraViewModel,
              onOpenEditor: () -> Unit,
              onLibrary: () -> Unit,
              onSettings: () -> Unit
          ) {
              val context = LocalContext.current
              val lifecycleOwner = LocalLifecycleOwner.current
              val state by vm.state.collectAsStateWithLifecycle()
              val scope = rememberCoroutineScope()
              val snackbar = remember { SnackbarHostState() }
              val controller = remember { CameraController(context.applicationContext) }
              val entry = remember {
                  EntryPointAccessors.fromApplication(context.applicationContext, CameraEntryPoint::class.java)
              }
              val detector = remember { entry.documentDetector() }
              val gallery = remember { entry.galleryStore() }
              var focusPoint by remember { mutableStateOf<Offset?>(null) }
              var flashFrame by remember { mutableStateOf(false) }
              val previewView = remember {
                  PreviewView(context).apply {
                      scaleType = PreviewView.ScaleType.FILL_CENTER
                      implementationMode = PreviewView.ImplementationMode.COMPATIBLE
                  }
              }
              val faceAnalyzer = remember { FaceAnalyzer { vm.onFaces(it) } }
              DisposableEffect(Unit) { onDispose { faceAnalyzer.close() } }
              val analyzer = remember {
                  FrameAnalyzer(
                      detector,
                      enabled = { vm.analysisEnabled() },
                      faceAnalyzer = faceAnalyzer,
                      faceEnabled = { vm.faceAnalysisEnabled() }
                  ) { vm.onFrame(it) }
              }
              val picker = rememberLauncherForActivityResult(ActivityResultContracts.PickVisualMedia()) { uri ->
                  if (uri != null) vm.onImport(uri.toString())
              }
              // Appareil photo du téléphone (traitement MIUI), puis recadrage automatique.
              var systemPath by remember { mutableStateOf<String?>(null) }
              val systemCamera = rememberLauncherForActivityResult(ActivityResultContracts.TakePicture()) { ok ->
                  systemPath?.let { vm.onSystemCaptureResult(it, ok) }
                  systemPath = null
              }
              fun launchSystemCamera() {
                  val path = vm.startSystemCapture() ?: return
                  systemPath = path
                  try {
                      systemCamera.launch(gallery.uriForFile(File(path)))
                  } catch (e: Exception) {
                      vm.onSystemCaptureResult(path, false)
                      systemPath = null
                      scope.launch { snackbar.showSnackbar(context.getString(R.string.error_no_camera_app)) }
                  }
              }

              /** Projection d'un point normalisé de l'image analysée vers les pixels de l'aperçu (FILL_CENTER). */
              fun toPreview(nx: Float, ny: Float, fw: Int, fh: Int): Offset {
                  val vw = previewView.width.toFloat().coerceAtLeast(1f)
                  val vh = previewView.height.toFloat().coerceAtLeast(1f)
                  val scale = max(vw / fw, vh / fh)
                  return Offset(nx * fw * scale + (vw - fw * scale) / 2f, ny * fh * scale + (vh - fh * scale) / 2f)
              }

              // Mise au point automatique sur le plus grand visage (au plus toutes les 1,5 s ou s'il bouge).
              var lastFaceFocus by remember { mutableStateOf(0L) }
              var lastFaceCenter by remember { mutableStateOf(Offset.Zero) }
              LaunchedEffect(state.faces) {
                  val main = state.faces.maxByOrNull { it.area } ?: return@LaunchedEffect
                  val nx = if (state.front) 1f - main.centerX else main.centerX
                  val c = Offset(nx, main.centerY)
                  val now = System.currentTimeMillis()
                  if (now - lastFaceFocus > 1500 || (c - lastFaceCenter).getDistance() > 0.15f) {
                      lastFaceFocus = now
                      lastFaceCenter = c
                      val p = toPreview(c.x, c.y, state.faceFrameWidth, state.faceFrameHeight)
                      controller.focusAt(previewView, p.x, p.y)
                  }
              }

              // Gestes sur l'aperçu : pincer = zoom, toucher = mise au point, glisser = changer de mode.
              DisposableEffect(previewView) {
                  val scaleDetector = ScaleGestureDetector(context, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                      override fun onScale(detector: ScaleGestureDetector): Boolean {
                          controller.scaleZoom(detector.scaleFactor)
                          return true
                      }
                  })
                  val gestureDetector = GestureDetector(context, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onDown(e: MotionEvent): Boolean = true

                      override fun onSingleTapUp(e: MotionEvent): Boolean {
                          controller.focusAt(previewView, e.x, e.y)
                          focusPoint = Offset(e.x, e.y)
                          return true
                      }

                      override fun onFling(e1: MotionEvent?, e2: MotionEvent, velocityX: Float, velocityY: Float): Boolean {
                          if (e1 == null) return false
                          val dx = e2.x - e1.x
                          val dy = e2.y - e1.y
                          if (abs(dx) > 120 && abs(dx) > abs(dy) * 1.5f) {
                              vm.swipeMode(if (dx < 0) 1 else -1)
                              return true
                          }
                          return false
                      }
                  })
                  previewView.setOnTouchListener { _, ev ->
                      scaleDetector.onTouchEvent(ev)
                      if (!scaleDetector.isInProgress) gestureDetector.onTouchEvent(ev)
                      true
                  }
                  onDispose { previewView.setOnTouchListener(null) }
              }

              val isVideoMode = state.mode == CameraMode.VIDEO
              LaunchedEffect(state.front, isVideoMode, state.videoQuality) {
                  controller.bind(lifecycleOwner, previewView, analyzer, state.front, isVideoMode, state.videoQuality) { t ->
                      scope.launch { snackbar.showSnackbar(t.message ?: "Camera error") }
                  }
              }
              // Micro : demandé une fois à l'entrée en mode Vidéo (sans micro, vidéo muette).
              val micPermission = rememberPermissionState(Manifest.permission.RECORD_AUDIO)
              var micAsked by remember { mutableStateOf(false) }
              LaunchedEffect(isVideoMode) {
                  if (isVideoMode && !micPermission.status.isGranted && !micAsked) {
                      micAsked = true
                      micPermission.launchPermissionRequest()
                  }
              }
              DisposableEffect(Unit) { onDispose { controller.release() } }
              LaunchedEffect(state.torchOn, state.mode) { controller.setTorch(state.torchOn && state.mode != CameraMode.PHOTO) }
              LaunchedEffect(state.flash) { controller.setFlash(state.flash) }
              LaunchedEffect(focusPoint) { if (focusPoint != null) { delay(900); focusPoint = null } }
              LaunchedEffect(flashFrame) { if (flashFrame) { delay(110); flashFrame = false } }
              LaunchedEffect(Unit) {
                  vm.events.collect { e ->
                      when (e) {
                          is CameraEvent.Capture -> {
                              if (e.focusFirst) {
                                  // Mise au point sur le centre du document (ou de l'écran) avant la photo.
                                  val q = vm.state.value.quad
                                  val st = vm.state.value
                                  val p = if (q != null) {
                                      toPreview(q.points.map { it.x }.average().toFloat(), q.points.map { it.y }.average().toFloat(), st.frameWidth, st.frameHeight)
                                  } else {
                                      Offset(previewView.width / 2f, previewView.height / 2f)
                                  }
                                  controller.focusAndWait(previewView, p.x, p.y)
                              }
                              flashFrame = true
                              when (val r = controller.capture(File(e.path))) {
                                  is AppResult.Success -> vm.onDocumentSaved(e.path)
                                  is AppResult.Error -> vm.onCaptureFailed(r.message)
                              }
                          }
                          CameraEvent.TakePhoto -> {
                              flashFrame = true
                              val s = vm.state.value
                              val target = withContext(Dispatchers.IO) { gallery.photoOutput(s.photoDest, s.photoTreeUri) }
                              when (val r = controller.captureTo(target.options)) {
                                  is AppResult.Success -> {
                                      val uri = withContext(Dispatchers.IO) { gallery.finish(target, true, r.data) }
                                      vm.onPhotoSaved(uri?.toString())
                                  }
                                  is AppResult.Error -> {
                                      withContext(Dispatchers.IO) { gallery.finish(target, false, null) }
                                      vm.onPhotoFailed(r.message)
                                  }
                              }
                          }
                          CameraEvent.StartVideo -> {
                              val s = vm.state.value
                              val target = withContext(Dispatchers.IO) { gallery.videoOutput(s.photoDest, s.photoTreeUri) }
                              val started = controller.startRecording(target, micPermission.status.isGranted) { ev ->
                                  when (ev) {
                                      is VideoRecordEvent.Start -> vm.onRecordingStarted()
                                      is VideoRecordEvent.Status -> vm.onRecordingStatus(
                                          ev.recordingStats.recordedDurationNanos / 1_000_000_000L,
                                          ev.recordingStats.numBytesRecorded
                                      )
                                      is VideoRecordEvent.Finalize -> {
                                          val ok = !ev.hasError() || ev.error in setOf(
                                              VideoRecordEvent.Finalize.ERROR_FILE_SIZE_LIMIT_REACHED,
                                              VideoRecordEvent.Finalize.ERROR_SOURCE_INACTIVE
                                          )
                                          val uri = gallery.finishVideo(target, ok, ev.outputResults.outputUri)
                                          if (ok) vm.onVideoSaved(uri?.toString())
                                          else vm.onVideoFailed(ev.cause?.message ?: context.getString(R.string.error_video))
                                      }
                                      else -> Unit
                                  }
                              }
                              if (!started) {
                                  gallery.finishVideo(target, false, null)
                                  vm.onVideoFailed(context.getString(R.string.error_video))
                              }
                          }
                          CameraEvent.StopVideo -> controller.stopRecording()
                          CameraEvent.OpenEditor -> onOpenEditor()
                          is CameraEvent.Error -> snackbar.showSnackbar(e.message)
                      }
                  }
              }

              val isDoc = state.mode == CameraMode.DOCUMENT
              val busyRecording = state.recording || state.videoBusy

              Box(Modifier.fillMaxSize().background(Color.Black)) {
                  AndroidView(factory = { previewView }, modifier = Modifier.fillMaxSize())
                  if (isDoc) DetectionOverlay(state)
                  if (state.mode == CameraMode.PHOTO && state.faceDetection) FaceOverlay(state)
                  FocusRing(focusPoint)
                  if (flashFrame) Box(Modifier.fillMaxSize().background(Color.Black.copy(alpha = 0.6f)))

                  // Barre supérieure
                  Row(
                      Modifier.fillMaxWidth().statusBarsPadding().padding(horizontal = 8.dp, vertical = 6.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      RoundIcon(onClick = { if (!busyRecording) onLibrary() }) {
                          Icon(Icons.Outlined.FolderOpen, stringResource(R.string.library_title), tint = Color.White)
                      }
                      Spacer(Modifier.weight(1f))
                      if (isDoc) {
                          RoundIcon(onClick = { launchSystemCamera() }) {
                              Icon(Icons.Outlined.HighQuality, stringResource(R.string.action_system_camera), tint = Color.White)
                          }
                          Spacer(Modifier.size(8.dp))
                          RoundIcon(onClick = vm::toggleAuto) {
                              Icon(
                                  Icons.Outlined.AutoMode,
                                  stringResource(if (state.autoCapture) R.string.auto_on else R.string.auto_off),
                                  tint = if (state.autoCapture) ScanGreen else Color.White
                              )
                          }
                          Spacer(Modifier.size(8.dp))
                      }
                      if (state.mode == CameraMode.PHOTO) {
                          RoundIcon(onClick = vm::toggleFaces) {
                              Icon(
                                  if (state.faceDetection) Icons.Outlined.Face else Icons.Outlined.FaceRetouchingOff,
                                  stringResource(if (state.faceDetection) R.string.faces_on else R.string.faces_off),
                                  tint = if (state.faceDetection) ModeYellow else Color.White
                              )
                          }
                          Spacer(Modifier.size(8.dp))
                      }
                      RoundIcon(onClick = vm::onFlashClick) {
                          val (icon, label) = if (state.mode != CameraMode.PHOTO) {
                              if (state.torchOn) Icons.Outlined.FlashlightOn to R.string.torch_on
                              else Icons.Outlined.FlashlightOff to R.string.torch_off
                          } else when (state.flash) {
                              FlashSetting.OFF -> Icons.Outlined.FlashOff to R.string.flash_off
                              FlashSetting.AUTO -> Icons.Outlined.FlashAuto to R.string.flash_auto
                              FlashSetting.ON -> Icons.Outlined.FlashOn to R.string.flash_on
                          }
                          Icon(icon, stringResource(label), tint = if (state.mode != CameraMode.PHOTO && state.torchOn) ModeYellow else Color.White)
                      }
                      Spacer(Modifier.size(8.dp))
                      RoundIcon(onClick = { if (!busyRecording) onSettings() }) {
                          Icon(Icons.Outlined.Settings, stringResource(R.string.settings_title), tint = Color.White)
                      }
                  }

                  // Nombre de visages (mode Photo)
                  if (state.mode == CameraMode.PHOTO && state.faces.isNotEmpty()) {
                      Text(
                          pluralStringResource(R.plurals.faces_detected, state.faces.size, state.faces.size),
                          color = Color.Black,
                          style = MaterialTheme.typography.labelLarge,
                          modifier = Modifier
                              .align(Alignment.TopCenter)
                              .statusBarsPadding()
                              .padding(top = 68.dp)
                              .background(ModeYellow, RoundedCornerShape(50))
                              .padding(horizontal = 14.dp, vertical = 6.dp)
                              .semantics { liveRegion = LiveRegionMode.Polite }
                      )
                  }

                  // Aide (mode Documents)
                  if (isDoc) {
                      val hint = when {
                          state.processing -> R.string.hint_processing
                          !state.detected -> R.string.hint_searching
                          !state.sharp -> R.string.hint_blurry
                          !state.stable -> R.string.hint_hold_still
                          state.autoCapture -> R.string.hint_capturing
                          else -> R.string.hint_ready
                      }
                      Text(
                          stringResource(hint),
                          color = Color.White,
                          style = MaterialTheme.typography.labelLarge,
                          modifier = Modifier
                              .align(Alignment.TopCenter)
                              .statusBarsPadding()
                              .padding(top = 68.dp)
                              .background(Color.Black.copy(alpha = 0.55f), RoundedCornerShape(50))
                              .padding(horizontal = 16.dp, vertical = 8.dp)
                              .semantics { liveRegion = LiveRegionMode.Polite }
                      )
                  }

                  // Durée et taille pendant l'enregistrement
                  if (isVideoMode && state.recording) {
                      val mm = state.recordSeconds / 60
                      val ss = state.recordSeconds % 60
                      val mb = state.recordBytes / 1_048_576.0
                      Row(
                          Modifier
                              .align(Alignment.TopCenter)
                              .statusBarsPadding()
                              .padding(top = 68.dp)
                              .background(Color(0xCCD32F2F), RoundedCornerShape(50))
                              .padding(horizontal = 14.dp, vertical = 6.dp)
                              .semantics { liveRegion = LiveRegionMode.Polite },
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Box(Modifier.size(10.dp).background(Color.White, CircleShape))
                          Spacer(Modifier.size(8.dp))
                          Text(
                              String.format(java.util.Locale.US, "%02d:%02d  ·  %.1f Mo", mm, ss, mb),
                              color = Color.White,
                              style = MaterialTheme.typography.labelLarge
                          )
                      }
                  }

                  // Partie basse : modes + déclencheur
                  Column(
                      Modifier
                          .align(Alignment.BottomCenter)
                          .fillMaxWidth()
                          .background(Color.Black.copy(alpha = 0.55f))
                          .navigationBarsPadding()
                          .pointerInput(Unit) {
                              var total = 0f
                              detectHorizontalDragGestures(
                                  onDragStart = { total = 0f },
                                  onDragEnd = {
                                      if (abs(total) > 80f) vm.swipeMode(if (total < 0) 1 else -1)
                                      total = 0f
                                  },
                                  onHorizontalDrag = { change, amount -> change.consume(); total += amount }
                              )
                          }
                          .padding(bottom = 18.dp)
                  ) {
                      Row(
                          Modifier.fillMaxWidth().padding(top = 10.dp, bottom = 14.dp),
                          horizontalArrangement = Arrangement.Center
                      ) {
                          CameraMode.values().forEach { m ->
                              val isSel = m == state.mode
                              Text(
                                  stringResource(m.labelRes()),
                                  color = if (isSel) ModeYellow else Color.White,
                                  style = MaterialTheme.typography.titleMedium,
                                  fontWeight = if (isSel) FontWeight.Bold else FontWeight.Medium,
                                  modifier = Modifier
                                      .clip(RoundedCornerShape(50))
                                      .clickable(role = Role.Tab) { vm.setMode(m) }
                                      .padding(horizontal = 20.dp, vertical = 8.dp)
                                      .semantics { selected = isSel }
                              )
                          }
                      }
                      Row(
                          Modifier.fillMaxWidth().padding(horizontal = 32.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.SpaceBetween
                      ) {
                          // Gauche : vignette
                          if (isDoc) {
                              PagesThumb(state.lastPageThumb, state.pageCount, onOpenEditor)
                          } else {
                              PhotoThumb(state.lastPhoto, state.lastIsVideo) { uri ->
                                  ShareUtils.viewMedia(context, Uri.parse(uri), if (state.lastIsVideo) "video/*" else "image/*")
                              }
                          }
                          // Centre : déclencheur
                          if (isVideoMode) {
                              VideoShutter(recording = state.recording, busy = state.videoBusy, onClick = vm::onShutter)
                          } else {
                              ShutterButton(
                                  progress = if (isDoc) state.progress else 0f,
                                  busy = if (isDoc) state.processing else state.photoBusy,
                                  onClick = vm::onShutter
                              )
                          }
                          // Droite : import (Documents) ou caméra avant/arrière (Photo)
                          Box(
                              Modifier.size(56.dp).background(Color.White.copy(alpha = 0.15f), CircleShape),
                              contentAlignment = Alignment.Center
                          ) {
                              if (isDoc) {
                                  IconButton(onClick = {
                                      picker.launch(PickVisualMediaRequest(ActivityResultContracts.PickVisualMedia.ImageOnly))
                                  }) {
                                      Icon(Icons.Outlined.PhotoLibrary, stringResource(R.string.action_import), tint = Color.White)
                                  }
                              } else {
                                  IconButton(onClick = vm::switchLens, enabled = !busyRecording) {
                                      Icon(Icons.Outlined.Cameraswitch, stringResource(R.string.action_switch_camera), tint = Color.White)
                                  }
                              }
                          }
                      }
                  }
                  SnackbarHost(snackbar, Modifier.align(Alignment.BottomCenter).padding(bottom = 190.dp))
              }
          }

          /** Vignette ronde de la dernière photo (mode Photo). */
          @Composable
          private fun PhotoThumb(uri: String?, isVideo: Boolean, onOpen: (String) -> Unit) {
              val label = stringResource(R.string.action_view_photo)
              Box(
                  Modifier
                      .size(56.dp)
                      .clip(CircleShape)
                      .background(Color.White.copy(alpha = 0.15f))
                      .border(2.dp, Color.White, CircleShape)
                      .clickable(enabled = uri != null, role = Role.Button) { uri?.let(onOpen) }
                      .semantics { contentDescription = label }
              ) {
                  if (uri != null) {
                      AsyncImage(model = Uri.parse(uri), contentDescription = null, contentScale = ContentScale.Crop, modifier = Modifier.fillMaxSize())
                      if (isVideo) {
                          Icon(
                              Icons.Filled.PlayArrow, contentDescription = null, tint = Color.White,
                              modifier = Modifier.align(Alignment.Center).size(24.dp)
                          )
                      }
                  }
              }
          }

          /** Déclencheur vidéo : rond rouge, carré rouge pendant l'enregistrement. */
          @Composable
          private fun VideoShutter(recording: Boolean, busy: Boolean, onClick: () -> Unit) {
              val label = stringResource(if (recording) R.string.action_stop_video else R.string.action_start_video)
              val inner by animateFloatAsState(if (recording) 0.45f else 0.82f, tween(200), label = "rec")
              Box(
                  Modifier
                      .size(80.dp)
                      .border(5.dp, Color.White, CircleShape)
                      .clip(CircleShape)
                      .clickable(enabled = !busy, role = Role.Button, onClick = onClick)
                      .semantics { contentDescription = label },
                  contentAlignment = Alignment.Center
              ) {
                  Box(
                      Modifier
                          .size(80.dp * inner)
                          .background(Color(0xFFE53935), if (recording) RoundedCornerShape(8.dp) else CircleShape)
                  )
                  if (busy) CircularProgressIndicator(Modifier.size(34.dp), color = Color.White, strokeWidth = 3.dp)
              }
          }

          /** Vignette des pages scannées (mode Documents). */
          @Composable
          private fun PagesThumb(path: String?, count: Int, onOpen: () -> Unit) {
              val label = stringResource(R.string.action_open_pages, count)
              BadgedBox(badge = { if (count > 0) Badge { Text("$count") } }) {
                  Box(
                      Modifier
                          .size(48.dp, 56.dp)
                          .clip(RoundedCornerShape(8.dp))
                          .background(Color.White.copy(alpha = 0.15f))
                          .border(2.dp, Color.White, RoundedCornerShape(8.dp))
                          .clickable(enabled = count > 0, role = Role.Button, onClick = onOpen)
                          .semantics { contentDescription = label }
                  ) {
                      if (path != null && File(path).exists()) {
                          AsyncImage(model = File(path), contentDescription = null, contentScale = ContentScale.Crop, modifier = Modifier.fillMaxSize())
                      }
                  }
              }
          }

          /** Cadres jaunes autour des visages détectés (aperçu miroir pour la caméra avant). */
          @Composable
          private fun FaceOverlay(state: CameraUiState) {
              val faces = state.faces
              if (faces.isEmpty()) return
              Canvas(Modifier.fillMaxSize()) {
                  val fw = state.faceFrameWidth.toFloat()
                  val fh = state.faceFrameHeight.toFloat()
                  val scale = max(size.width / fw, size.height / fh)
                  val dx = (size.width - fw * scale) / 2f
                  val dy = (size.height - fh * scale) / 2f
                  val stroke = Stroke(3.dp.toPx(), cap = StrokeCap.Round)
                  faces.forEach { f ->
                      val l0 = if (state.front) 1f - f.right else f.left
                      val r0 = if (state.front) 1f - f.left else f.right
                      val left = l0 * fw * scale + dx
                      val right = r0 * fw * scale + dx
                      val top = f.top * fh * scale + dy
                      val bottom = f.bottom * fh * scale + dy
                      val c = minOf(right - left, bottom - top) * 0.25f
                      val path = Path().apply {
                          moveTo(left, top + c); lineTo(left, top); lineTo(left + c, top)
                          moveTo(right - c, top); lineTo(right, top); lineTo(right, top + c)
                          moveTo(right, bottom - c); lineTo(right, bottom); lineTo(right - c, bottom)
                          moveTo(left + c, bottom); lineTo(left, bottom); lineTo(left, bottom - c)
                      }
                      drawPath(path, ModeYellow, style = stroke)
                  }
              }
          }

          /** Cercle de mise au point. */
          @Composable
          private fun FocusRing(point: Offset?) {
              val alpha by animateFloatAsState(if (point != null) 1f else 0f, tween(200), label = "focus")
              var last by remember { mutableStateOf(Offset.Zero) }
              LaunchedEffect(point) { if (point != null) last = point }
              Canvas(Modifier.fillMaxSize()) {
                  if (alpha > 0.01f) {
                      drawCircle(ModeYellow.copy(alpha = alpha), 36.dp.toPx(), last, style = Stroke(2.dp.toPx()))
                  }
              }
          }

          /** Contour vert animé du document détecté, projeté des coordonnées frame vers l'écran. */
          @Composable
          private fun DetectionOverlay(state: CameraUiState) {
              val q = state.quad
              val alpha by animateFloatAsState(if (q != null) 1f else 0f, tween(180), label = "alpha")
              val pts = (q ?: Quad.FULL_INSET).points
              val animated = pts.mapIndexed { i, p -> animatedPt(p, i) }
              Canvas(Modifier.fillMaxSize()) {
                  if (alpha <= 0.01f) return@Canvas
                  val fw = state.frameWidth.toFloat()
                  val fh = state.frameHeight.toFloat()
                  val scale = max(size.width / fw, size.height / fh)
                  val dx = (size.width - fw * scale) / 2f
                  val dy = (size.height - fh * scale) / 2f
                  fun toScreen(p: Pt) = Offset(p.x * fw * scale + dx, p.y * fh * scale + dy)
                  val path = Path().apply {
                      val o = animated.map { toScreen(it) }
                      moveTo(o[0].x, o[0].y)
                      for (i in 1..3) lineTo(o[i].x, o[i].y)
                      close()
                  }
                  val color = if (state.stable) ScanGreen else Color(0xFFFFD54F)
                  drawPath(path, color.copy(alpha = 0.18f * alpha), style = Fill)
                  drawPath(path, color.copy(alpha = 0.30f * alpha), style = Stroke(14.dp.toPx(), join = StrokeJoin.Round))
                  drawPath(path, color.copy(alpha = alpha), style = Stroke(4.dp.toPx(), join = StrokeJoin.Round, cap = StrokeCap.Round))
                  animated.forEach { drawCircle(Color.White.copy(alpha = alpha), 6.dp.toPx(), toScreen(it)) }
