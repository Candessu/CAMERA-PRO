              /** Supprime un document et tous ses fichiers. */
              suspend fun delete(doc: Document) = withContext(Dispatchers.IO) {
                  doc.pages.forEach { fileStore.deleteQuietly(it.originalPath, it.processedPath) }
                  fileStore.deleteQuietly(doc.pdfPath)
                  dao.delete(doc.id)
