              private val secureDir: File get() = File(context.filesDir, "secure").apply { mkdirs() }
              private val shareDir: File get() = File(context.cacheDir, "shared").apply { mkdirs() }

              /** Dossier public (propre à l'app) des PDF. */
              val documentsDir: File
                  get() = (context.getExternalFilesDir(Environment.DIRECTORY_DOCUMENTS)
                      ?: File(context.filesDir, "documents")).apply { mkdirs() }

              /** Nouveau chemin pour une capture caméra. */
              fun newCaptureFile(): File = File(pagesDir, "${UUID.randomUUID()}_orig.jpg")

              /** Nouveau chemin d'image avec un suffixe (évite le cache Coil). */
              fun newImageFile(tag: String): File = File(pagesDir, "${UUID.randomUUID()}_$tag.jpg")

              /** Enregistre un bitmap en JPEG et renvoie son chemin. */
              fun saveJpeg(bitmap: Bitmap, file: File, quality: Int = 92): String {
                  FileOutputStream(file).use { bitmap.compress(Bitmap.CompressFormat.JPEG, quality, it) }
                  return file.absolutePath
              }

              /** Copie une image choisie dans la galerie vers le stockage interne. */
              fun copyFromUri(uri: String): File {
                  val out = newCaptureFile()
                  context.contentResolver.openInputStream(Uri.parse(uri)).use { input ->
                      requireNotNull(input) { "Image illisible" }
                      FileOutputStream(out).use { input.copyTo(it) }
                  }
                  return out
              }

              /** Fichier PDF public unique pour [baseName]. */
              fun uniquePdfFile(baseName: String): File = unique(documentsDir, sanitize(baseName), ".pdf")

              /** Fichier chiffré unique pour [baseName]. */
              fun uniqueSecureFile(baseName: String): File = unique(secureDir, sanitize(baseName), ".pdf.enc")

              /** Fichier temporaire dans le cache. */
              fun tempFile(name: String): File = File(context.cacheDir, name)

              /** Fichier de partage (cache) pour un PDF déchiffré. */
              fun shareFile(name: String): File = File(shareDir, sanitize(name) + ".pdf")

              /** Vide le dossier de partage (fichiers déchiffrés temporaires). */
              fun clearShareCache() {
                  shareDir.listFiles()?.forEach { it.delete() }
              }

              /** Supprime les fichiers donnés sans lever d'erreur. */
              fun deleteQuietly(vararg paths: String?) {
                  paths.forEach { p -> if (!p.isNullOrBlank()) runCatching { File(p).delete() } }
              }

              private fun unique(dir: File, base: String, ext: String): File {
                  var f = File(dir, base + ext)
                  var i = 1
                  while (f.exists()) {
                      f = File(dir, "${base}_$i$ext")
                      i++
                  }
                  return f
              }

              companion object {
                  /** Nettoie un nom de fichier. */
                  fun sanitize(name: String): String =
                      name.trim().replace(Regex("[\\\\/:*?\"<>|]"), "_").ifBlank { "Scan" }.take(80)
              }
          }
