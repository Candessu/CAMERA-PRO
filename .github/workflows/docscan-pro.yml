          /**
           * Export multi-pages via l'API native [PdfDocument].
           * Chaque page fait 595 pt de large (A4) et conserve le ratio de l'image.
           */
          @Singleton
          class PdfExporter @Inject constructor() {

              /** Écrit les images [imagePaths] dans [target] avec la qualité [quality]. */
              fun export(imagePaths: List<String>, target: File, quality: PdfQuality) {
                  require(imagePaths.isNotEmpty()) { "Aucune page" }
                  val pdf = PdfDocument()
                  val paint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
                  try {
                      imagePaths.forEachIndexed { index, path ->
                          val bmp = BitmapUtils.decode(path, quality.maxSide)
                          try {
                              val pageW = 595
                              val pageH = (pageW * bmp.height.toFloat() / bmp.width).toInt().coerceIn(200, 2000)
                              val info = PdfDocument.PageInfo.Builder(pageW, pageH, index + 1).create()
                              val page = pdf.startPage(info)
                              page.canvas.drawColor(Color.WHITE)
                              page.canvas.drawBitmap(
                                  bmp, Rect(0, 0, bmp.width, bmp.height),
                                  RectF(0f, 0f, pageW.toFloat(), pageH.toFloat()), paint
                              )
                              pdf.finishPage(page)
                          } finally {
                              bmp.recycle()
                          }
                      }
                      target.parentFile?.mkdirs()
                      FileOutputStream(target).use { pdf.writeTo(it) }
                  } finally {
                      pdf.close()
                  }
              }
          }
