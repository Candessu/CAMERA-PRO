                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  } catch (e: ActivityNotFoundException) {
                      Toast.makeText(context, R.string.error_no_pdf_app, Toast.LENGTH_LONG).show()
                  }
              }

              /** Ouvre une photo ou une vidéo dans la visionneuse du téléphone. */
              fun viewMedia(context: Context, uri: android.net.Uri, mime: String) {
                  val intent = Intent(Intent.ACTION_VIEW).apply {
                      setDataAndType(uri, mime)
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                  }
                  try {
                      context.startActivity(intent)
                  } catch (e: ActivityNotFoundException) {
                      Toast.makeText(context, R.string.error_no_viewer, Toast.LENGTH_LONG).show()
                  }
              }

              /** Ouvre la feuille de partage native (ACTION_SEND). */
              fun sharePdf(context: Context, file: File) {
                  val intent = Intent(Intent.ACTION_SEND).apply {
                      type = "application/pdf"
                      putExtra(Intent.EXTRA_STREAM, uri(context, file))
                      putExtra(Intent.EXTRA_SUBJECT, file.nameWithoutExtension)
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  }
                  context.startActivity(Intent.createChooser(intent, context.getString(R.string.action_share))
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
              }
