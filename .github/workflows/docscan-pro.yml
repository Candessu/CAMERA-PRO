          /** ViewModel caméra : modes Photo / Documents, lissage du cadre, auto-capture, recadrage. */
          @HiltViewModel
          class CameraViewModel @Inject constructor(
              private val autoCapture: AutoCaptureUseCase,
              private val processCapture: ProcessCaptureUseCase,
